version: v0.4
project:
  name: 'IE-14: sharp growth for complex cyclic tridiagonal partial pivoting'
  description: The exact attained growth F_(n+1)+1 for every n≥4, over all nonsingular complex cyclic tridiagonal
    inputs with both corners nonzero, all permitted maximal-modulus GEPP tie paths, and every entry of every
    active Schur complement. Literal row swaps start at the given input; an all-size rational witness attains
    the greatest value.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: The complete seven-target formalization passed actual non-root Linux run 35035525244 at immutable proof
    commit 6e48f25fffdae2cf93e4985dc515abbd15e0481b. All mathematical source remains unchanged in this publication
    update; the sole build-configuration change selects Solution as the default target. Its frozen predecessor
    is retained.
