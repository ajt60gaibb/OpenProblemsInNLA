automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4.33.1, LeanCert 621a43d7cf21f87872392a01e874f2f1dbddc926, Mathlib 0df444a360eaa60ab8c11dca51a86af692955474.
      Both independent exact-byte statement approvals preceded implementation at commit 58b516b6dbb7fa4e885b679d261bf779c263aad4.
    prompting_notes: Preserve all dimensions, complex entries, nonzero corners, fixed original input ordering,
      all permitted maximal-modulus ties and all active entries. Prove the original-row front from actual swaps
      and use symbolic maximum/sum recurrences for all column histories, including n=4 and the final two-row
      stage. Prove a complete nonsingular GEPP path by supported-vector injectivity. Prove actual witness swaps
      through a tail-product identity in physical row coordinates. The LeanCert kernel conjunction 0<1/2 and
      1/2≤1 is consumed in nonzero upper-factor pivots and exact witness-entry bounds.
  notes: 'Substantial AI assistance. Proof contributors: coordinator /root and /root/target_inventory. Independent
    statement referees /root/reference_api_review and /root/existing_verification_audit contributed no proof
    code and remain independent for later reviews. Repository Tau Ceti adaptation; no official endorsement,
    external human review, novelty certification or unmeasured cost claims. Two independent complete-source
    reviews and the later full source/runtime review are retained. A separate coordinator operational audit
    also checked the actual GitHub execution. The publication agent /root/next_elimination edited metadata/evidence
    only, changed no mathematical code and ran no local Lean/Lake.'
