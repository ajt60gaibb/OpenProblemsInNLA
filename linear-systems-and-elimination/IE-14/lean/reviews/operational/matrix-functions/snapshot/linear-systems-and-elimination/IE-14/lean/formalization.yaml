# yaml-language-server: $schema=../../../docs/lean/schema/v0.4.schema.json
version: v0.4
project:
  name: 'IE-14: sharp growth for complex cyclic tridiagonal partial pivoting'
  description: >-
    The exact attained growth F_(n+1)+1 for every n≥4, over all nonsingular complex
    cyclic tridiagonal inputs with both corners nonzero, all permitted maximal-modulus
    GEPP tie paths, and every entry of every active Schur complement. Literal row
    swaps start at the given input; an all-size rational witness attains the greatest value.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: >-
    Complete local proof candidate after independently approved pre-proof boundary
    commit 58b516b6dbb7fa4e885b679d261bf779c263aad4. Independent complete-source
    reviews and authoritative Linux Comparator/default-kernel verification remain pending.
