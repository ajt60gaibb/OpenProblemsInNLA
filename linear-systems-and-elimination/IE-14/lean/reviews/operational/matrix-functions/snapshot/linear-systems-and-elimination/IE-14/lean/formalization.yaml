  type: web-post
  relationship: formalizes
  location: >-
    Complete original problem statement: all n≥4, nonsingular complex cyclic tridiagonal
    matrices with both corners nonzero, original ordering, all admissible GEPP ties,
    and the maximum over every active entry at every stage.
  author_endorsement: not-contacted
  note: Permanent ID, canonical path and complete original mathematical target are preserved unchanged.
- title: Sharp growth for cyclic tridiagonal partial pivoting
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/d8c38a795876b132c90df8d1be8682d3dcde394c/references/colbrook-recovered-2026-09-11/manuscripts/IE-14.tex
  type: manuscript
  relationship: formalizes
  location: >-
    Theorem 1 and Sections 2–4: two-old/one-fresh original-row front, every column's
    history, the Fibonacci upper bound and an all-size rational attaining construction.
  author_endorsement: not-contacted
  note: >-
    Original mathematical authorship remains Matthew J. Colbrook, Department of Applied
    Mathematics and Theoretical Physics, University of Cambridge. The complete original
    source, historical review and attribution are preserved. The formal proof records
    the old pair's maximum and sum instead of sorting its entries; it proves the original
    label invariant from actual swaps and realizes the prescribed witness order through
    the literal current-last-row path. No additional target assumptions are introduced.
    Formalization credit is supplied as requested by the campaign user; no separate
    author endorsement or external human review is asserted.
- title: Accuracy and Stability of Numerical Algorithms, second edition
  authors:
  - Nicholas J. Higham
  id: https://doi.org/10.1137/1.9780898718027
  type: book
  relationship: background
  location: >-
    Problem 9.15(b), printed page 193, asks for sharp GEPP growth in the two-corner
    quasi-tridiagonal pattern; Theorem 9.11, printed page 173, supplies the complex
    banded-matrix and ordinary tridiagonal comparison.
  author_endorsement: not-contacted
