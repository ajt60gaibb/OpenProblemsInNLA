fidelity:
  divergences: No weakening of the complete canonical target. M is the attained supremum of actual normalized
    floor-row singular values over every unit-row matrix. The finite projection and probability bounds,
    exact floor(n^(2/3)) and n^(-1/6) schedule, uniformity in all m, every high-aspect lower witness and
    limit, and no-smaller-constant quantifiers are proved. The source Hermite-series Poincare sketch is
    replaced by an exact elementary scalar crossing-kernel argument, actual nonsmooth hinge regularity
    and proved finite-product variance tensorization. This changes the proof route without assuming the
    desired variance estimate. The quantitative O_theta constant is explicitly 22+4L^2+8L, with L=2/(1-theta).
    Zero rows of projected matrices, rank deficiency and empty retained selections are included.
review:
  status: approved-source-and-authoritative-evidence-by-two-independent-nonauthor-agents
  notes: Both fresh nonauthor AI referees read the complete source and independently audited the retained
    Linux inputs, dependency identities, actual separate exports, kernel assertions/replay, axiom closures
    and real controls. Original source reports and receipts remain unchanged; completion addenda bind
    the verification evidence. The exact source snapshot, including its then-pending README and metadata,
    is retained in verification/linux/source. Current README/metadata and canonical status are post-run
    publication documentation; proofs, statements, pins, build configuration and Comparator input are
    unchanged. Subsequent publication addenda review these documentation deltas. Preproof and incremental
    reviews retain disclosed authorship limits. No external human peer review or official Tau Ceti endorsement
    is claimed.
  reviewers:
  - /root/ie22_final_fidelity
  - /root/ie22_final_correctness
