fidelity:
  divergences: No weakening of the complete canonical target. M is the attained supremum of actual normalized
    floor-row singular values over every unit-row matrix. The finite projection and probability bounds,
    exact floor(n^(2/3)) and n^(-1/6) schedule, uniformity in all m, every high-aspect lower witness and
    limit, and no-smaller-constant quantifiers are proved. The source Hermite-series Poincare sketch is
    replaced by an exact elementary scalar crossing-kernel argument, actual nonsmooth hinge regularity
    and proved finite-product variance tensorization. This changes the proof route without assuming the
    desired variance estimate. The quantitative O_theta constant is explicitly 22+4L^2+8L, with L=2/(1-theta).
    Zero rows of projected matrices, rank deficiency and empty retained selections are included.
