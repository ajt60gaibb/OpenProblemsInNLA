  description: The literal supremum over every real unit-row matrix has sharp asymptotic constant sqrt(h_theta),
    with the exact finite projected-Gaussian certificate, an explicit uniform squared O_theta(n^(-1/6))
    rate, matching deterministic spherical realizations, every high-aspect sequence limit, and failure
    of the original eventual-uniform property for every smaller constant.
