# yaml-language-server: $schema=../../../docs/lean/schema/v0.4.schema.json
version: v0.4
project:
  name: 'IE-06: Gaussian partial-pivoting growth'
  description: Complete local Lean proof of the original all-Schur square-root upper-exponent limit and a stronger
    arbitrary-polynomial tail at sqrt(n) exp(C sqrt(log n)), including the actual Gaussian law, all admissible
    pivot paths, measurability, path existence, and Gaussian nonsingularity.
  authors:
  - Codex AI agents (formalization, infrastructure, and independent agent review)
  license: Apache-2.0
repository:
  role: substantive-development
  note: Prepared locally at the maintainer's request. Nothing has been committed, pushed, or submitted as a
    pull request; no remote CI was dispatched. John Urschel has not been contacted. Publication remains for
    the maintainer to decide after speaking with him.
sources:
- title: IE-06 — The square-root upper bound for Gaussian partial-pivoting growth
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/286d8768fbd9a69264daa88e285680293db29837/linear-systems-and-elimination/IE-06/README.md
  type: web-post
  location: Complete Context and notation and Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  contributors:
  - name: Lloyd N. Trefethen
    role: Original conjecture, including its presentation with David Bau III
  note: Both the original HEAD page and the preexisting working resolution update are retained verbatim in
    source/. This task leaves canonical files unchanged.
- title: On the Growth Factor of Random Matrices
  authors:
  - John Urschel
  id: https://arxiv.org/abs/2610.06785v1
  type: article
  location: Sections 4 and 5; Theorem 1.4, Proposition 5.1, selected-block extension and spectral recursion
  relationship: adapts
  author_endorsement: not-contacted
  note: The displayed Theorem 1.4 concerns LU growth. The stronger all-Schur estimate is extracted from the
    argument, with exact elimination, normalization, and almost-sure tie bridges proved here. All required
    probabilistic estimates are supplied by proved Lean declarations; no manuscript theorem is assumed as an
    axiom.
- title: Generic IE-04 exact GEPP definitions
  authors:
  - George Stepaniants
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/286d8768fbd9a69264daa88e285680293db29837/linear-systems-and-elimination/IE-04/lean/NLA/IE04/Definitions.lean
  type: software
  relationship: adapts
  license: Apache-2.0
  author_endorsement: not-contacted
  note: 'Credits retained for AI-assisted generic definitions. George Stepaniants: Department of Computing
    and Mathematical Sciences, California Institute of Technology. No IE-04 problem-specific target or numerical
    witness is imported.'
- title: Prékopa–Leindler formalization in isoperimetric
  id: https://github.com/hojonathanho/isoperimetric/tree/29768f8beeaf17295cdf3853d37da35d7e2b0a5f
  type: software
  relationship: adapts
  license: Apache-2.0
  author_endorsement: not-contacted
  note: Minimal compatibility port of proved Basic and PrekopaLeindler modules. Immutable source copies, license,
    source hashes, exact statement-preservation review, and axiom audits are retained in source/ and reviews/.
- title: Gaussian concentration and singular-value infrastructure in lean-stat-learning-theory
  id: https://github.com/YuanheZ/lean-stat-learning-theory/tree/d0f506f0a695018265dccb33bcb05e2f5ca1c876
  type: software
  relationship: adapts
  license: Apache-2.0
  author_endorsement: not-contacted
  note: Pinned proved Gaussian Lipschitz concentration closure and MatrixInfra modules, compiled with the existing
    project dependency pins. Immutable sources, licenses, compatibility records, independent reviews, and transitive
    axiom audits are retained.
