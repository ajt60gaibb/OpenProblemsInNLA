version: v0.4
project:
  name: 'IE-06: Gaussian partial-pivoting growth'
  description: Linux-verified Lean proof of the original all-Schur square-root upper-exponent limit and a stronger
    arbitrary-polynomial tail at sqrt(n) exp(C sqrt(log n)), including the actual Gaussian law, all admissible
    pivot paths, measurability, path existence, and Gaussian nonsingularity.
  authors:
  - Codex AI agents (formalization, infrastructure, and independent agent review)
  license: Apache-2.0
repository:
  role: substantive-development
  note: Prepared for publication at the maintainer's request after the maintainer reported John Urschel's permission
    to publish on 2026-10-06. Publication permission is not a claim of correctness endorsement or human peer
    review. Historical validation receipts precede publication; see PUBLICATION.md.
sources:
- title: IE-06 — The square-root upper bound for Gaussian partial-pivoting growth
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/286d8768fbd9a69264daa88e285680293db29837/linear-systems-and-elimination/IE-06/README.md
  type: web-post
  location: Complete Context and notation and Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  contributors:
  - name: Lloyd N. Trefethen
    role: Original conjecture, including its presentation with David Bau III
  note: Both the original HEAD page and the preexisting working resolution update are retained verbatim in
    source/. The proof-development phase left canonical files unchanged; publication adds evidence links and
    regenerated documents while retaining the complete original target.
- title: On the Growth Factor of Random Matrices
  authors:
  - John Urschel
  id: https://arxiv.org/abs/2610.06785v1
  type: article
  location: Sections 4 and 5; Theorem 1.4, Proposition 5.1, selected-block extension and spectral recursion
  relationship: adapts
  author_endorsement: other
  note: The maintainer reports Urschel's permission to publish this formalization (2026-10-06); no correctness
    endorsement or human peer review is claimed. The displayed Theorem 1.4 concerns LU growth. The stronger
    all-Schur estimate is extracted from the argument, with exact elimination, normalization, and almost-sure
    tie bridges proved here. All required probabilistic estimates are supplied by proved Lean declarations;
    no manuscript theorem is assumed as an axiom.
- title: Generic IE-04 exact GEPP definitions
  authors:
  - George Stepaniants
