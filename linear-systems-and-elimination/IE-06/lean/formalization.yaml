  type: software
  relationship: adapts
  license: Apache-2.0
  author_endorsement: not-contacted
  note: 'Credits retained for AI-assisted generic definitions. George Stepaniants: Department of Computing
    and Mathematical Sciences, California Institute of Technology. No IE-04 problem-specific target or numerical
    witness is imported.'
- title: Prékopa–Leindler formalization in isoperimetric
