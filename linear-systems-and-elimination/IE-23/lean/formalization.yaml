  note: Colbrook retains the mathematical resolution. The rational matrices are unchanged. The p=4 case
    gives the full canonical negative answer. All-p formulas, full minimizer classifications, higher-dimensional
    families, smallest-dimension classification and endpoints are outside these eight exports.
