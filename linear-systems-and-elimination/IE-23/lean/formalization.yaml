  type: preprint
  location: Example 4.1, equations (51)-(53), pp.16-17; Corollary 4.2(3) and Remark 4.1, p.18
  relationship: background
  author_endorsement: not-contacted
  note: Retains attribution for the underlying rational A and Moore-Penrose example and the original direct-inverse
