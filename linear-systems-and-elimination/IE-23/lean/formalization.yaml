    semantics cover every original domain. All eight exports passed two independent statement reviews,
    two independent final proof reviews and actual Linux sandboxed Comparator/default-kernel verification
    in run 34725525250 on 2026-09-12 at unchanged proof revision a40e5608f61dd4086708cb2e03901ffd01e4c0a9.
    All 190 submitted inputs, sixteen standard-three axiom reports and both actual control suites were
    operationally inspected by the proof author and independently accepted by the coordinator. Canonical
    status is Lean verified. Source all-p formulas, full classifications, higher-dimensional families
    and endpoints remain outside the eight exports.
