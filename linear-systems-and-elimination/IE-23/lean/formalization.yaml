alignment:
- declaration: NLA.IE23.inducedNorm_semantics
  scope: 'Generic actual nonzero-input supremum semantics for every original domain: denominator positivity,
    nonempty bounded ratio set, IsLUB, nonnegativity and all-input inequality including zero.'
- declaration: NLA.IE23.witness_matrix_identities
  scope: Exact full row rank, genuine matrix inverse and Moore-Penrose formula, both right inverses, distinctness
    and Gram identities for the source witness.
- declaration: NLA.IE23.fourth_power_norm_control
  scope: Exact positive fourth-root/real-power identities and the universal unsquared norm comparison
    for all complex two-vectors at p=4.
- declaration: NLA.IE23.witness_action_identities
  scope: Actual actions on every complex input and the squared Euclidean lower-bound identity for every
    complex right-inverse competitor.
- declaration: NLA.IE23.witness_attainment
  scope: Actual nonzero norming vector and both attained ratios, with true denominator and Euclidean numerators.
- declaration: NLA.IE23.witness_norms
  scope: Equalities of the actual nonzero-input suprema of both distinct feasible matrices with the positive
    fourth root of two.
- declaration: NLA.IE23.witness_global_minimizers
  scope: Both matrices are global minimizers over all complex right inverses, and their common norm is
    IsLeast of the entire feasible value set.
- declaration: NLA.IE23.not_rightInverseUniqueConjecture
  scope: Unconditional negation of the complete original all-dimension, all-full-row-rank-complex-matrix,
    finite-real-p>2 strict uniqueness conjecture.
acknowledgements: Matthew J. Colbrook for the mathematical resolution; Dokmanić and Gribonval for the
  underlying example and original question; Mathlib and LeanCert contributors for actual norms, powers,
