fidelity:
  divergences: No narrowing of the original conjecture being negated. The same source matrices at m=2,n=3,p=4
    suffice to refute its all-dimension/all-p statement. Generic denominator/supremum semantics are proved
    on every original domain. The actual complex inverse, rank, Euclidean norm, real powers, all-input
    suprema and all-right-inverse global minimality are retained. The stronger source all-p formulas and
    full minimizer classifications, higher-dimensional families, smallest-dimension classification, endpoints
    and separate product objective are outside these exports.
