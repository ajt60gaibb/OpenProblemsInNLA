version: v0.4
project:
  name: 'IE-21: complete spherical-row deletion limit with quantitative bounds'
  description: The exact squared floor-row deletion singular value divided by the squared Euclidean operator
    norm converges to the canonical truncated Gaussian second moment for every n→∞ and m/n→∞, with the
    explicit finite-size bounds and actual normalized surface-law semantics proved.
