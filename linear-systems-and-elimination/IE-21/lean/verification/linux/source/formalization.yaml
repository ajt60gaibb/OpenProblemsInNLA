fidelity:
  divergences: No weakening of the complete canonical probability-limit or quantitative target. Auxiliary
    results explicitly prove the underlying finite minima, exact quantile, actual surface law, Gaussian
    independence, all-orders moments and concentration bounds. Changing probability spaces, arbitrary
    diverging aspect ratios, empty retained selections and rank-deficient cases are included.
review:
  status: preproof-boundary-approved-and-incremental-modules-reviewed; final-reviews-pending
  notes: Preproof and incremental reports identify exact source hashes and distinguish authors from independent
    module reviewers. The final package still requires two fresh nonauthor whole-proof reviews plus actual
    Linux verification evidence. No complete-verification or publication approval is claimed at this stage.
