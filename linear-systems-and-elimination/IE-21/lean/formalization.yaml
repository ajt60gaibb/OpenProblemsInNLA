      rebuilt.
    prompting_notes: Preserve complete canonical statements, all aspect sequences, actual surface law,
      operator and deletion semantics, exact constants and original attribution; independently review
      the frozen statements before implementation.
  notes: Substantial Codex assistance. canonical_inventory authored the frozen statement boundary, MatrixSemantics,
    FiniteTrimming, PointwiseTrimmingSemantics, UniformTrimmingGeometry/Bound and final UniformTrimming.
    infrastructure_audit authored surface/row/Gaussian polar and moment/MGF modules. reference_review
    authored Gaussian/Population/Quantile/Empirical/Spherical trimming, bounded/five-tail concentration
    and final PointwiseTrimming. Root authored AspectSchedule, SphereNet, QuadraticNet, Chernoff, CovarianceConcentration/Covariance,
