review:
  status: Two independent complete mathematical source reviews retained; current-source and actual development
    evidence accepted by the inequalities referee. Both final canonical source/runtime addenda and packaging
    review remain pending.
  notes: Independent statement approvals and actual Linux declaration elaboration preceded the immutable
    freeze. Both full source reports are retained with their exact input hashes; the root report identifies
    its pre-repair snapshot. The inequalities addendum independently matches every accepted current source,
    all 115 shared Git inputs, nine command logs, before/after hashes and 21 standard-axiom target reports.
    Canonical final-byte reconciliation by both referees remains pending. An implementer is not counted
    as its own referee.
  reviewers:
  - 'OpenAI Codex agent /root: independent mathematical source referee and coordinator'
  - 'OpenAI Codex agent /root/next_inequalities: independent mathematical source and development-evidence
    referee; later metadata/package preparer'
fidelity:
  divergences: Zero-based stage indexing replaces one-based indexing. The lower tail event explicitly
    includes input nonsingularity, so it is a subset of any total-extension tail; disproving its upper
    bound suffices for the original negative target without assuming a nullity theorem. The radius and
    main probability exponent match the source exactly. Optional center-zero and weaker shorthand probability
    corollaries are not claimed.
