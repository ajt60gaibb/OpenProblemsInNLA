automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        Two independent statement approvals and actual non-root Linux declaration
        elaboration preceded a hash-bound freeze and proof construction. Actual
        development runs check proof modules with LeanCert kernel assertions.
        No local Lean/Lake invocation or dependency/cache download is performed.
      prompting_notes: >-
        Preserve the complete Gaussian probability and true GEPP algorithm;
        reuse existing generic source; reduce the full box to scalar quotient
        and update estimates and the product measure to one scalar interval.
  notes: >-
    Substantial AI assistance. Eight complete proof modules passed development
    run 35029609317, but the complete build failed. Candidate repairs and final
    gates remain pending. No external human peer review, official Tau Ceti
    certification, actual canonical Comparator acceptance or complete verification
    is claimed.
status:
  scope: >-
    Complete negation of the original uniform exponential tail. The stronger
    witness violates every proposed positive constant pair at identity center,
    noise level one, and a sufficiently large dimension for every measurable
    admissible tie rule. The actual nonsingular high-growth event is required.
