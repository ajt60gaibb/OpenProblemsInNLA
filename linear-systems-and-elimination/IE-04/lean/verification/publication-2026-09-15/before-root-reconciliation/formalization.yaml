version: v0.4
project:
  name: 'IE-04: no uniform exponential Gaussian-smoothed GEPP tail'
  description: Complete formally checked negative resolution of the uniform exponential Gaussian-smoothed GEPP
    tail, with all 21 frozen obligations, genuine product Gaussian measures, the full nonsingular perturbation
    box and arbitrary positive real proposed constants.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: Complete proof accepted at 026b3e5534a4d6e15ebffb85318c2ff031df32bf in canonical non-root Linux run
    35034399633. The publication documentation preserves all accepted mathematical and configuration bytes;
    its subsequent workflow rerun remains pending.
