review:
  status: Both independent final mathematical source and actual canonical runtime reviews accepted the exact
    proof revision 026b3e5534a4d6e15ebffb85318c2ff031df32bf. Publication metadata is separately reviewed by
    the coordinator.
  notes: Two independent statement approvals and actual Linux declaration elaboration preceded the immutable
    freeze. Both complete mathematical source reports retain their original input hashes; source/development
    addenda and final canonical reviews bind the complete accepted graph. Each final referee independently
    inspected all 184 project inputs, the 21 exports, original raw command output and mandatory controls. An
    implementer is not counted as its own referee. Later metadata preparation is disclosed separately.
  reviewers:
  - 'OpenAI Codex agent /root: independent mathematical source referee and coordinator'
  - 'OpenAI Codex agent /root/next_inequalities: independent mathematical source and development-evidence referee;
    later metadata/package preparer'
fidelity:
  divergences: Zero-based stage indexing replaces one-based indexing. The lower tail event explicitly includes
    input nonsingularity, so it is a subset of any total-extension tail; disproving its upper bound suffices
    for the original negative target without assuming a nullity theorem. The radius and main probability exponent
    match the source exactly. Optional center-zero and weaker shorthand probability corollaries are not claimed.
