version: "v0.4"
project:
  name: "IE-18: a counterexample to the four-step Anderson identity"
  description: >-
    Derives the actual two residual-map executions and the maximum over the
    genuine Hermitian eigenvalue list, then refutes the complete original
    universal maximum identity by an admissible strict counterexample.
  authors: [George Stepaniants]
  affiliations:
    George Stepaniants: >-
      Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers: [George Stepaniants]
  license: Apache-2.0
repository:
  role: substantive-development
sources:
  - title: "IE-18 — The exact four-step amplification of restarted Anderson acceleration"
    id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5adea969c17391693978ada2674d25bb5c3daeb1/linear-systems-and-elimination/IE-18/README.md
    type: web-post
    location: Problem statement
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Canonical residual-map formulation of the identity attributed to
      Krzysik, De Sterck and Smith, Conjecture 10 and equation (24).
  - title: "IE-18: counterexamples to the exact four-step identity"
    authors: [Matthew J. Colbrook]
    id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5adea969c17391693978ada2674d25bb5c3daeb1/references/colbrook-recovered-2026-09-11/manuscripts/IE-18.tex
    type: manuscript
    location: Section 2, positive definite counterexample
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The concrete strict counterexample fully refutes the canonical identity.
      The stronger parameter-family result and separate asymptotic convergence
      question are not claimed as formally verified.
related_formalizations:
