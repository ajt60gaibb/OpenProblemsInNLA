    declarations: [NLA.IE18.residualMap, NLA.IE18.amplification, NLA.IE18.FourStepConjecture]
  - source: Colbrook Section 2, exact residual and squared norm certificate
    declarations: [NLA.IE18.residual_certificate]
  - source: Actual spectral maximum and complete negative answer
    declarations: [NLA.IE18.counterexample, NLA.IE18.not_fourStepConjecture]
