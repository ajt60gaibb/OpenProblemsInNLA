automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        Multiple agents, two independent statement reviews before proof,
        exact rational residual algebra, Mathlib diagonal spectrum and actual
        Hermitian eigenvalue range, explicit kernel LeanCert for one scalar.
      prompting_notes: >-
        Preserve the complete maximum identity and the actual Euclidean norm.
        Prove spectral upper bound and attainment without computing a chosen
        eigenbasis. Compare the squared norm ratio with the second square of
        the proposed factor, then prove the unsquared inequality.
  notes: >-
    AI-assisted formalization requested by George Stepaniants. No external
    human peer review, source-author endorsement, unrecorded exact model
    identity or measured monetary cost is claimed.
status:
  scope: >-
    Complete negative answer to the canonical IE-18 universal identity.
    Local Lean compilation, standard-axiom checks and two independent final
    proof reviews passed. Authoritative Linux Comparator remains pending;
    the canonical mathematical status is still Solved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
