fidelity:
  divergences: >-
    No weakening of the original problem target. Replace the source's
    normalized random grid by integer coordinates on a power-of-two grid;
    each bad coordinate fiber contains at most one point, so finite counting
    proves the needed probability. Prove direct shifted-power estimates
    rather than a separate theorem about all polynomials. Implement radius
    approximation by sequential enumeration of positive rationals and
    circle directions by a finite rational stereographic mesh. Give the
    explicit universal query constant 32768. The algorithm has exact real
    arithmetic and comparison semantics through Part, with every search
    proved terminating; no total-runtime, bit-complexity, or floating-point
    guarantee is asserted. The finite cardinality seed law is uniform and
    its power-of-two grid admits a fixed finite fair-bit realization.
