status:
  scope: >-
    Every positive dimension n, K >= 1, 0 < epsilon < 1/2, and complex
    diagonalizable matrix with Euclidean diagonalizer condition number at
    most K and positive actual spectral radius. One concrete algorithm
    terminates on every finite random seed, uses at most
    32768*(1+log(n*K))/epsilon^2 exact matrix-vector queries on every seed,
    and with probability at least 99/100 returns z such that one actual eigenvalue
    mu satisfies both required relative location and near-largest-modulus
    inequalities. Repeated eigenvalues and ties are included.
  whole_problem_verified: true
  canonical_status: Lean verified
  sorry_count: 0
  sorry_in_definitions: 0
  source_scan_note: >-
    Challenge contains one deliberate comparison placeholder and is excluded
    from the Solution import graph. No mathematical cases remain unproved;
    all frozen proof inputs match the successful Linux verification receipt.
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
