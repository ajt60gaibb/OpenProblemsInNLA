fidelity:
  divergences: No target weakening. Solution.lean exports the complete unchanged NLA.Statements.SP12.Target.
    Actual PSD and all three exact SAP constraints, the natural proper-color minimum,
    nullity, and all graph quantifiers are retained. Live and separately frozen statement
    bytes are unchanged; Identity.lean checks equality by rfl. The Gram-factor inverse-function
    route and finite graph induction adapt the application note while avoiding an
    assumed rank manifold or continuous preimage selection.
