automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement approvals before implementation, then two independent
      final proof reviews using fresh private-prefix source elaboration, actual compiled dependency inspection
      and retained-checker replay.
    prompting_notes: Preserve all original quantifiers and actual matrix characteristic-polynomial, derivative,
      trace and power semantics. Prove every potential real realization has the seven exact traces; derive
      separability and the actual eigenbasis instead of assuming diagonalizability. Use multiplicity-aware
      generic Vieta/Newton identities and materially consume only the explicit kernel LeanCert singleton
      -8593/823543<0. Avoid approximate roots, numerical eigensolvers and interval subdivision.
  notes: AI-assisted formalization requested by George Stepaniants. The statement and proof coauthors
    are /root and /root/solved_statement_inventory; root implemented the generic Newton module and the
    latter agent prepared the candidate metadata. Neither coauthor is an independent final referee. Both
    independent statement and final referee roles are held by /root/leancert_examples and /root/formal_review_standards.
    Referee 2 also contributed shared infrastructure, but not IS-03 mathematical source. Packaging and
    root acceptance add no mathematical referee. No external human review, official Tau Ceti endorsement,
    source-author endorsement, measured cost, model identity or priority is claimed.
