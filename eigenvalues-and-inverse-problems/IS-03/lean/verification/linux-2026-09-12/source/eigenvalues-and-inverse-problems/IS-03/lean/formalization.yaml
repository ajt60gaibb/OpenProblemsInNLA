fidelity:
  divergences: No narrowing of the original universal target being negated. The unchanged order-seven
    source matrix suffices; entrywise nonnegativity is not matrix PSD order, powers are genuine matrix
    powers, traces are actual diagonal sums, and characteristic polynomials use det(XI-A). The trace certificate
    has arbitrary real B with only its characteristic-polynomial equality as premise. Separability, six
    roots, complex transport, an actual eigenbasis, trace powers and full factorization are derived. The
    generic Newton module permits repeated values and retains multiplicities. Source claims about arbitrary
    zero padding, Monov, minimal order and historical priority are outside the seven exports.
