  role: substantive-development
sources:
- title: IS-03 - Johnson's derivative-realizability conjecture
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/f41f1f9ffa2171550d4bb795862c6170c4f26070/eigenvalues-and-inverse-problems/IS-03/README.md
  type: web-post
  location: Complete original Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Every n at least five and every real entrywise-nonnegative matrix of order n; genuine matrix characteristic-polynomial
    derivative divided by n and a real entrywise-nonnegative realization of exactly order n-1. The entire
    assertion is negated; no symmetry, diagonalizability, irreducibility, simple-spectrum or trace premise
    is added.
- title: A seven-dimensional counterexample to derivative realizability
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/f41f1f9ffa2171550d4bb795862c6170c4f26070/eigenvalues-and-inverse-problems/IS-03/solution.md
  type: manuscript
  location: Theorem 1 and equations (1)-(7), full exact-order negative answer; SourceCorrespondence.md
    and verification/PROOF_MAP.md map the seven exports
  relationship: formalizes
  author_endorsement: not-contacted
  note: Colbrook retains mathematical authorship. The unchanged source witness is diag(1/2,C2,C4). Every
    real potential order-six realization has the seven proved power traces, culminating in -8593/823543.
    Generic spectral, basis, trace and Newton bridges are proved internally. Stronger arbitrary-zero-padding
    exclusion and the separate Monov consequence are outside the exports.
- title: On the realizability of the critical points of a realizable list
  authors:
  - Hoover
  - McCormick
  - Paparella
  - Thrall
  id: https://arxiv.org/abs/1712.05454
  type: preprint
  location: Conjecture 1.2, page 2, and Section 6
  relationship: formalizes
  author_endorsement: not-contacted
  note: The source credits the original derivative-realizability conjecture to Johnson. Its unrestricted
    exact-order statement is the target being refuted. No result from this paper is an unproved formal
    premise.
