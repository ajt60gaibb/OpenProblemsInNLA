alignment:
- declaration: NLA.IS03.nonnegative_power_trace
  scope: For every real square matrix and every natural power, entrywise nonnegativity implies entrywise
    nonnegativity of the actual matrix power and nonnegativity of its genuine trace, including order and
    power zero.
- declaration: NLA.IS03.witness_admissible
  scope: The unchanged order-seven source matrix is entrywise nonnegative and its actual trace is 1/2.
- declaration: NLA.IS03.witness_polynomials
  scope: The actual witness characteristic polynomial and its actual normalized derivative equal the source
    polynomials, and the derivative polynomial is monic of degree six.
- declaration: NLA.IS03.trace_moment_certificate
  scope: Every arbitrary real order-six matrix with the displayed characteristic polynomial has the seven
    stated actual matrix-power traces, with no additional nonnegativity or spectral assumption.
- declaration: NLA.IS03.negative_moment
  scope: The seventh prescribed trace is exactly -8593/823543 and strictly negative, using the materially
    retained explicit kernel LeanCert singleton certificate.
- declaration: NLA.IS03.counterexample
  scope: The admissible actual order-seven witness has no entrywise-nonnegative real order-six realization
    of its actual normalized characteristic-polynomial derivative.
- declaration: NLA.IS03.not_derivativeRealizabilityConjecture
  scope: Unconditional negation of the full original all-n-at-least-five, all-real-entrywise-nonnegative-matrix,
    exact-order-n-minus-one derivative-realizability conjecture.
