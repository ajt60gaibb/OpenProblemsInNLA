    file: Solution.lean
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: comparator.json
    verification_status: >-
      Full canonical source closure passed 42 fresh local Lean commands, with
      LeanCert kernel trust and only propext, Classical.choice, Quot.sound for
      the selected target. Final independent package reviews and isolated Linux
