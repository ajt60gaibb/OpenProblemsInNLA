fidelity:
  divergences: No narrowing of the original universal statement being negated. The unchanged admissible
    source box in dimension three suffices. Actual matrix-vector equations, determinants, the full independent-entry
    box, real subset topology, ConnectedComponents and Cardinal order are retained. The generic determinant
    bridge also covers dimension zero, while the conjecture retains positive dimensions. Optional source
    determinant-range surjectivity, exactly four components, complete endpoints and a general replacement
    bound are outside the exports.
