alignment:
- declaration: NLA.IV06.eigenvalue_determinant_semantics
  scope: Equivalence between a genuine nonzero real eigenvector and the actual characteristic determinant
    being zero, for every real square matrix including dimension zero.
- declaration: NLA.IV06.family_and_determinant_semantics
  scope: Exact equality of the complete independent-entry endpoint box with the two-parameter source family,
    and the actual determinant polynomial for unrestricted real parameters and spectral value.
- declaration: NLA.IV06.witness_eigenpairs
  scope: Four admissible source matrices, proved nonzero integer vectors, actual eigenpair equations and
    membership in the attained real-eigenvalue set.
- declaration: NLA.IV06.witness_separators
  scope: Actual determinant bounds for every matrix in the full box, strict negativity and exclusion of
    all three separating values.
- declaration: NLA.IV06.connected_component_intervals
  scope: For every real subset, equality of actual connected-component classes implies containment of
    the real interval between the representatives, without closedness or finiteness assumptions.
- declaration: NLA.IV06.four_components
  scope: An actual Fin 4 representative map injective into ConnectedComponents, and the true Cardinal
    lower bound four.
- declaration: NLA.IV06.counterexample
  scope: Admissible dimension-three endpoints whose actual attained real-eigenvalue component cardinality
    strictly exceeds three.
- declaration: NLA.IV06.not_componentBoundConjecture
  scope: Unconditional negation of the complete original all-positive-dimension, all-real-independent-entry
    interval-box component-bound conjecture.
