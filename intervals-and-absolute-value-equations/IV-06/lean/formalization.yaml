fidelity:
  divergences: No narrowing of the original universal statement being negated. The unchanged admissible
    source box in dimension three suffices. Actual matrix-vector equations, determinants, the full independent-entry
    box, real subset topology, ConnectedComponents and Cardinal order are retained. The generic determinant
    bridge also covers dimension zero, while the conjecture retains positive dimensions. Optional source
    determinant-range surjectivity, exactly four components, complete endpoints and a general replacement
    bound are outside the exports.
review:
  status: agent-reviewed; Linux-Comparator-and-default-kernel-verified
  reviewers:
  - 'OpenAI Codex agent /root: independent statement referee 1 and final proof referee 2'
  - 'OpenAI Codex agent /root/formal_review_standards: independent statement referee 2'
  - 'OpenAI Codex agent /root/leancert_examples: independent final proof referee 1'
  notes: Both independent statement approvals preceded implementation. Both final referees freshly elaborated
    the proof in separate private prefixes, inspected actual terms, independently reconstructed exact
    universal bounds and repeated the retained LeanCert Boolean checker with decide +kernel. Seventeen
    internal/public assertions and transitive axiom reports allow only propext, Classical.choice and Quot.sound.
    The material interval certificate is exactly -18<0 in explicit kernel mode on a singleton, consumed
    through separator exclusion to the full negation. Local checks ran on macOS with read-only matching
    pinned MI-22 dependency objects and no old IV-06 project objects. Actual Ubuntu run 34725713519 at
    18b5ef3127da0ae4f68e09289f60fd4f6e3d9bcb freshly cloned ten exact dependencies, used 8690 official
    Mathlib cache artifacts, built the sources, matched all eight exports without definition exceptions,
    replayed the default kernel and passed both actual control suites. No full dependency-source rebuild
    is claimed. The nested Bubblewrap executable was denied UID-map creation before its inner write. Independent
    operational reviewer /root/formal_review_standards also served as statement referee 2 and contributed
    to shared infrastructure; proof author is /root/solved_statement_inventory. Root independently accepted
    actual execution and retained identity; root also served as final proof referee 2 and prepared publication
    metadata. These additional roles do not add mathematical referees. Operational report SHA256 4e212afc2458805a3684748939e46f47dac3e1f6e7576bb5fc8dc591d75ed7c8
    and outer evidence b4cde7e528bbf53ba50291e73d48ff27d490df228fbc0e9cea0f9d54011bc7d0 bind 347 files
