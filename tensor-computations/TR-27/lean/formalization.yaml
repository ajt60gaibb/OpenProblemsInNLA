  - /root/tr27_final_correctness
  notes: Both nonauthor final AI referees inspected the complete source and independently checked
    the actual Linux logs, all input hashes, statement exports, kernel assertions, axiom reports,
    dependency receipts and controls. Their original source reports and receipts remain unchanged;
    separate completion addenda record the completed gates. Preproof statement approvals and earlier
    module reviews retain their disclosed roles. Current README/metadata, completion addenda and
    canonical status are post-run publication documentation; the exact earlier input snapshot, including
    then-pending documentation, is retained in verification/linux/source. No mathematical, build
    or Comparator input changed. No official Tau Ceti endorsement or human peer review is claimed.
