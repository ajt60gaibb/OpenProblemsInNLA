fidelity:
  divergences: The required counterexample states border rank at most two, rank exactly three, and
    square rank exactly nine; these refute the full original implication. Optional source strengths
    including smoothness, exact border rank two, arbitrary finite delays, and eventual-power saving
    are not claimed.
