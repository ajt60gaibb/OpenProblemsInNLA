    prompting_notes: Preserve the complete projective target and separate tensor factors, require
      the whole closed-image equality, and review statements independently before implementing proofs.
  notes: Substantial Codex assistance. /root/canonical_inventory authored the statement boundary
    and Algebra, Independence and RankWitness. /root/reference_review authored IntegralImage, Geometry
    and BorderWitness. /root authored Semantics, SegreSemantics, AffineBorder, CoordinateTransport,
    Counterexample and final packaging. /root/infrastructure_audit authored ProjectiveGeometry after
    completing earlier independent statement and module reviews. Before any TR-27 proof, /root and
    /root/reference_review independently approved the boundary; those approvals remain statement-only.
    Module reviewers disclose their authorship limits. Fresh final referees /root/tr27_final_fidelity
    and /root/tr27_final_correctness authored none of the package. No human peer review, official
    Tau Ceti endorsement, or measured cost is claimed.
status:
  scope: Complete negative resolution of the original canonical conjecture, with all 25 reviewed
    required statements verified. The constructed admissible complex projective variety contains
    a point of rank 3 and border rank at most 2 whose ordinary Segre tensor square has rank 9. Both
    fresh nonauthor final referees approved source correspondence and the actual Linux evidence.
    No additional mathematical premise is assumed.
