version: v0.4
project:
  name: 'TR-27: complete projective tensor-square counterexample'
  description: 'The full canonical conjecture is false: a reduced irreducible nondegenerate complex
    projective curve has a point of rank 3 and border rank at most 2 whose ordinary Segre tensor
    square has rank 9. All geometric and rank semantics are proved.'
