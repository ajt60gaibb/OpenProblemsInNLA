  description: Formalizes the full negative answer to the canonical inheritance conjecture with
    actual ordered tensor contractions, real nonzero H-eigenpairs, universal lower positivity, an
    explicit upper negative pair and unconditional lower-pair existence from the intermediate value
    theorem.
