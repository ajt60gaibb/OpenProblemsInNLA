automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement approvals before any proof; pinned Mathlib
      finite-product, finite-sum and intermediate-value APIs; two independent final proof reviews
      with separate-prefix re-elaboration and actual proof-term inspection.
    prompting_notes: Preserve all original tensor orders, dimensions, generating-vector lengths,
      signed powers and nonzero real vectors. Derive contraction coefficients from every ordered
      tuple. Prove universal positivity from the first component sum of squares; reduce the upper
      contraction to its sole surviving tuple. Prove actual nonvacuity through IVT instead of root
      isolation. Use an explicit retained kernel LeanCert certificate for the negative eigenvalue
      sign.
  notes: AI-assisted formalization requested by George Stepaniants. Implementation agent /root/leancert_examples
    is not counted as an independent referee. No human peer review, source-author endorsement, unrecorded
    model identity or measured monetary cost is claimed.
