  type: web-post
  location: Complete original odd-lower-order inheritance implication
  relationship: formalizes
  author_endorsement: not-contacted
  note: All odd m≥3, integers q≥2 and n≥2, and all real common generators of length qm(n−1)+1. Actual
    lower order/dimension m and q(n−1)+1, and upper order/dimension qm and n, are retained.
- title: An exact counterexample to odd-order Hankel H-eigenvalue inheritance
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/references/colbrook-unclaimed-2026-09-11/manuscripts/TR-15.md
  type: manuscript
  location: Complete counterexample proposition, proof and nonvacuity argument
  relationship: formalizes
  author_endorsement: not-contacted
  note: The full mathematical source is preserved and attributed to Colbrook. The formalization
    includes both the canonical negative resolution and the source’s unconditional existence of
    a real lower H-eigenpair. Context concerning other inheritance or strong-Hankel theorems is
    not an exported result.
