alignment:
- declaration: NLA.TR15.lower_contractions
  scope: Exact contraction of the actual order-three, dimension-three Hankel tensor at every real
    vector, including all ordered summands and all components.
- declaration: NLA.TR15.upper_contraction
  scope: Exact full order-six contraction at the explicit nonzero vector (0,1), reduced by proving
    all other ordered terms vanish.
- declaration: NLA.TR15.lower_eigenvalues_pos
  scope: Strict positivity of every real lower H-eigenvalue from the actual eigenpair equations
    and a positive sum of squares; no existence premise.
- declaration: NLA.TR15.lower_eigenpair_exists
  scope: An actual root of 2t⁴+2t³+3t²−4t−1 strictly inside (0,1), supplied by IVT, and a genuine
    nonzero lower H-eigenpair.
- declaration: NLA.TR15.upper_negative_eigenpair
  scope: The actual order-six Hankel tensor has the exact real negative H-eigenpair (−1,(0,1)),
    with retained kernel LeanCert strict negativity.
- declaration: NLA.TR15.counterexample
  scope: The full admissible m=3,q=2,n=2 instance satisfies the original lower nonnegative-eigenvalue
    premise and violates the higher conclusion.
- declaration: NLA.TR15.not_inheritanceConjecture
  scope: Negation of the complete original inheritance conjecture, retaining all odd lower orders,
    all q≥2,n≥2 and every real common generator.
acknowledgements: Matthew J. Colbrook for the original counterexample and proof; Mathlib and LeanCert
  contributors for genuine finite tensor arithmetic, intermediate value theorem and checked certificate
