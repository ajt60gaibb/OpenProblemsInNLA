fidelity:
  divergences: No restriction of the original target. Zero-based Fin indices encode the exact original
    generator sums; finite bounds and equal generator lengths are proved rather than assumed. Contractions
    include every ordered tuple and signed coordinate factors. H-eigenpairs use real eigenvalues,
    nonzero real vectors and every component equation. The universal target retains every odd m≥3,
    all q≥2,n≥2 and all real generators, without associated-matrix PSD, strong-Hankel or eigenpair-existence
    assumptions. Total definitions outside the admissible domain do not affect the target. Actual
    IVT supplies a separate nonvacuity conclusion; it is not an extra premise.
