fidelity:
  divergences: No target weakening or substituted probability model. The intrinsic Target, infrastructure
    and Reviewed mirror are exact copies of the frozen statement; all ten original Challenge theorem
    types and all 58 retained sources are preserved. The proof derives full-measure regularity, positive
    annular volume, finite actual normalized graph volume, weighted angular area and Gaussian integrability
    from the original hypotheses. It includes every ordered branch and finite pivot family; no injectivity,
    properness, graph-volume or integrability oracle is added as a premise. The direct character/atlas
    and dyadic-annulus route replaces parts of the submitted exposition.
