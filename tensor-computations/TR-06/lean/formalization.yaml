  - /root/recover_algebra (algebra contributor; independent boundary and other-author source reviews)
  - /root/recover_geometry (geometry contributor; independent other-author source reviews)
  - /root/recover_verification (non-proof-author; independent fresh builds, types, kernel and evidence
    audits)
  notes: Two independent hash-bound pre-Solution boundary approvals, complete source reviews and independent
    fresh shared/canonical audits pass. The canonical audit rebuilds all144 inputs, checks all11 original/literal
    exports, 772 declarations, 545 theorem kinds and 21 private constants, and rejects all11 Challenge
    placeholders. Two strict actual Linux replays pass all45 controls and all153 proof-commit package
    inputs. Author/reviewer exclusions and pinned dependency-cache reuse are explicit. Descriptive/status
    promotion requires a fresh exact Linux receipt; all144 Lean inputs remain unchanged. Reviews are
    AI-agent work; no external human endorsement is claimed.
