status:
  phase: complete-proof-linux-verified
  scope: Every complex Hankel tensor for all orders m>=3 and dimensions n>=2 has an ordinary
    width-r decomposition if and only if it has a symmetric width-r decomposition, for every
    natural r including zero. Zero and exceptional tensors and arbitrary mode-dependent ordinary
    factors are included.
