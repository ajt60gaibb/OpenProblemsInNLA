fidelity:
  divergences: No target weakening. All original quantifiers, exact complex coefficients,
    unrestricted ordinary factors and all widths are retained. Live and frozen statement bytes
    remain unchanged, with Identity proving rfl equality. The proof uses a single actual normalized
    affine chart for both symmetric upper constructions and the arbitrary ordinary lower bound,
    so it does not need to export the stronger original projective-root rank formula. A finite-subspace
    unit-avoidance proof replaces the submitted proof's Vandermonde-curve selection within
    the contextual inequality.
