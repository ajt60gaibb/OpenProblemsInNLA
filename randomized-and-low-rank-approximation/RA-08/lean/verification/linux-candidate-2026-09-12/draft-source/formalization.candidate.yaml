  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/references/colbrook-transfer-2026-09-11/manuscripts/03_concave_transfer_counterexamples.tex
