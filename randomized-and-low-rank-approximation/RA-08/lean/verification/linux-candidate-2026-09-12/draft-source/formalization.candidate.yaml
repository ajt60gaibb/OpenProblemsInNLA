fidelity:
  divergences: No narrowing of the original universal implication being refuted. Every real dimension, rank,
    nonnegative error parameter, continuous nonnegative nondecreasing concave half-line function and selected
    ordered orthogonal eigenbasis is retained. Generic f(0)=0 is not assumed. Actual CFC, PSD order, Euclidean
    operator norm and every-basis truncation semantics are proved. The unchanged source witness is handled
    by an exact polynomial minorant with a weaker sufficient strict margin; the source larger contour ratio,
    separate Nyström sketch identity and ancillary stronger extensions are not exported.
