  note: Campaign numerical-target, explicit-kernel LeanCert and Comparator workflow example; no mathematical
    result is assumed.
- id: https://github.com/jaumededios/Schiffer/tree/2938e277969c329caf154e48a3d8823f3635c7f1
  relationship: other
  note: Statement/proof separation example studied by the campaign; no mathematical theorem is imported.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; exact source/statement review before implementation, followed by separate
      final mathematical and actual Linux operational gates. At this phase only the author statement checks
      and rational diagnostics have run.
    prompting_notes: Preserve every original real PSD, function, parameter and eigenbasis quantifier.
      Minimize computation using the unchanged rational witness, exact same-matrix polynomial CFC minorant,
      three unnormalized matrix-vector products and one materially consumed kernel-only LeanCert scalar
      sign. Do not assume spectral location, truncation optimality or operator monotonicity of min(x,1).
  notes: 'Statement author agent: /root/formal_review_standards. The root coordinator supplied a compression
    spectral-gap proof-route idea. Root and /root/solved_statement_inventory are assigned independent
    formal statement inspections; no approval is claimed yet. Final mathematical referees must exclude
    the author and every eventual mathematical coauthor. No human peer review, official Tau Ceti execution
    or endorsement, source-author endorsement, measured cost or priority is claimed.'
status:
  scope: Statement-only boundary for the entire original negative answer. Fourteen intentional Challenge
    placeholders; no Proof or Solution, no completed mathematical result, and no actual Linux run. Two
    statement approvals, implementation, independent final proofs reviews and operational/publication
    gates are pending. Canonical status stays Solved.
  sorry_in_definitions: 0
  main_results: []
fidelity:
  divergences: No narrowing of the original target. All original real dimensions, ranks, nonnegative epsilon,
    continuous nonnegative nondecreasing concave half-line functions and every selected ordered orthogonal
    eigenbasis are retained. Generic f(0)=0 is not assumed. Actual CFC/order/operator-norm and truncation
    bridges are explicit theorem obligations. The same source witness is evaluated with a new polynomial
    minorant and weaker strict rational margin; the manuscript's stronger contour ratio and ancillary
    extensions are not advertised.
review:
  status: unchecked statement boundary; independent statement reviews pending
  reviewers: []
  notes: 'Author-only fresh macOS typechecking and actual definition/API inspection used a private project
    prefix and ten clean pinned MI-22 dependency objects read-only; no Lake build, dependency copy or
    Linux result is claimed. Definition-only kernel trust assertions do not certify the admitted Challenge
    statements. The actual v0.4 schema applies now; the repository completion-only metadata validator
    is deferred because there are no completed main results. Pinned Tau Ceti scope: correctness, scope,
    proof quality, reuse, generality, API, naming, placement, documentation and attribution. The sole
    planned LeanCert numerical check is the positive rational gap on a singleton, whose actual checker
    must feed the full negation.'
