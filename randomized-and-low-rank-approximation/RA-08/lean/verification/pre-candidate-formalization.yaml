version: v0.4
project:
  name: 'RA-08: exact concave spectral-transfer counterexample (statement stage)'
  description: Proposed full-target formalization of Colbrook's unchanged six-dimensional rational counterexample,
    using an exact polynomial minorant instead of the contour remainder estimate. No implementation proof
    exists yet.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: RA-08 - Concave-function transfer of spectral low-rank error
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/randomized-and-low-rank-approximation/RA-08/README.md
  type: web-post
  location: Complete original mathematical statement, all quantifiers and shared spectral-truncation convention
  relationship: formalizes
  author_endorsement: not-contacted
- title: Concave matrix-function transfer counterexamples
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/references/colbrook-transfer-2026-09-11/manuscripts/03_concave_transfer_counterexamples.tex
  type: manuscript
  location: Theorem 3.1 and its complete proof; SourceCorrespondence.md maps the unchanged witness and
    modified proof route
  relationship: formalizes
  author_endorsement: not-contacted
  note: Colbrook retains mathematical authorship. The source witness at t=1/65536 is unchanged. The proposed
    polynomial route has a weaker strictly positive rational gap than the contour bound; the canonical
    full negative answer is the intended target. The stronger ratio, ancillary Nystrom sketch identity
    and nuclear or strictly-increasing extensions are outside the fourteen proposed exports.
- title: Algorithm-agnostic low-rank approximation of operator monotone matrix functions
  authors:
  - D. Persson
  - R. A. Meyer
  - C. Musco
  id: https://arxiv.org/html/2311.14023v2
  type: preprint
  location: 'Canonical attribution: Table 1 ordered concave spectral cell and Equation (2) truncation
    convention'
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original question attribution retained through the exact canonical source. No mathematical theorem
    from this paper is an unproved formal premise.
related_formalizations:
- id: https://github.com/sgstepaniants/Forsythe/tree/8d1b0c0545a77b40245e84705aa7d273e6c81e62/lean-proof
