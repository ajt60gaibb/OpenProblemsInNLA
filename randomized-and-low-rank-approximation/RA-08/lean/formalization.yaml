alignment:
- declaration: NLA.RA08.orderedSpectral_exists
  file: Solution.lean
  scope: Every actual real PSD matrix admits complete ordered orthogonal spectral data, including repeated
    eigenvalues and zero dimension.
- declaration: NLA.RA08.orderedSpectral_semantics
  file: Solution.lean
  scope: The selected columns are actual orthonormal eigenvectors, the selected eigenvalue combination
    reconstructs the matrix, and actual positive semidefiniteness follows.
- declaration: NLA.RA08.functionalCalculus_spectral
  file: Solution.lean
  scope: For every selected ordered spectral decomposition and every real scalar function, genuine CFC
    equals the selected spectral combination and is independent of the extension outside the nonnegative
    half-line.
- declaration: NLA.RA08.spectral_tail_norms
  file: Solution.lean
  scope: For every selected basis and admissible function, the actual Euclidean operator-norm tails of
    the original and function truncations equal the first discarded eigenvalue and its function value.
- declaration: NLA.RA08.operator_rayleigh_bound
  file: Solution.lean
  scope: For every real matrix and real vector, the absolute quadratic form is at most the genuine Euclidean
    operator norm times the squared Euclidean vector norm.
- declaration: NLA.RA08.witness_data
  file: Solution.lean
  scope: The unchanged source function and rational matrices satisfy admissibility, the exact projection
    and complement identities, positive definiteness and actual PSD order.
- declaration: NLA.RA08.witness_spectral_location
  file: Solution.lean
  scope: The actual real spectrum of the fixed witness is contained in [0,1] union [17/16,infinity); the
    entire open spectral gap is excluded by proof.
- declaration: NLA.RA08.minorant_scalar
  file: Solution.lean
  scope: The exact scalar polynomial minorant lies below min(x,1) throughout the entire proved nonnegative
    unbounded spectral set, with no operator-monotonicity assertion.
- declaration: NLA.RA08.minorant_functional_calculus
  file: Solution.lean
  scope: The actual polynomial CFC of the witness equals the stated matrix polynomial, which is below
    the genuine kink-function CFC in actual PSD order.
- declaration: NLA.RA08.witness_tail_data
  file: Solution.lean
  scope: For every permitted witness eigendecomposition, the residual norm and fourth eigenvalue are exactly
    t and the actual approximation truncations and both optimal tails have the stated values.
- declaration: NLA.RA08.witness_rational_certificate
  file: Solution.lean
  scope: All exact vector, matrix-product, squared-length, approximation CFC and actual minorant Rayleigh
    identities hold, with Rayleigh value 26*t*(1+witnessGap).
- declaration: NLA.RA08.numerical_gap_positive
  file: Solution.lean
  scope: The actual rational witnessGap is strictly positive, using the explicit-kernel LeanCert strict-upper-bound
    checker for zero on the singleton [0,0]; this term is materially used by the final result.
- declaration: NLA.RA08.counterexample
  file: Solution.lean
  scope: For every allowed ordered decomposition of the actual admissible source pair, the original spectral
    inequality holds at error zero and the transformed spectral inequality fails.
- declaration: NLA.RA08.not_concaveSpectralTransferConjecture
  file: Solution.lean
  scope: Unconditional negation of the complete canonical universal implication, retaining every original
    real PSD pair, dimension, rank, function, nonnegative error parameter and selected eigenbasis.
