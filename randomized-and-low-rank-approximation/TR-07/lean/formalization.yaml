fidelity:
  divergences: >-
    The entire original asymptotic target is retained. Explicit r_k <= n_k
    expresses the domain of the uniform subset experiment. Sparsity is
    required eventually, covering the irrelevant small dimensions k < s;
    positivity and divergence of r_k are proved from the ratio assumptions.
    Replace source pruning by the regularized diagonal D_i = E[u_i^2]+1/k,
    retaining the whole column law and adding an absorbing zero state.
    A PSD conjugation proves the averaged residual bound 2*s^2/(2*L+1)
    for the possibly nonsymmetric polynomial filter
    (I-Sigma*D^(-1)/s)^L; no Euclidean contraction of that filter is assumed.
    Use deletion deficiency instead of a count of small singular values,
    with a rank-nullity and Bessel argument for shared-reservoir witnesses.
    Prove finite weighted-law identities, IID variance bounds, and a
    binomial estimator averaged over independent paths conditional on its
    center. Finite positive L and b depend only on s and eta and make
    the ideal success probability at least 3/4. In the real reservoir
    transition, both the initial half-probability branch and a no-hit
    outcome return zero. This replaces the failure outcome in the frozen
    planned route by an honest finite law and preserves actual span
    membership and unconditional pointwise kernel domination. No favorable
    trajectory conditioning is assumed. With J=b*L, R=4*J, floor(r/2)
    centers and equal remaining blocks, use c=beta/(8*J) and
    rho=c^(L*b)/8=c^J/8, replacing the more conservative planned constants.
    IID variance at most r and sequential uniform collision repair with
    expected Hamming cost r*(r-1)/(2*n) yield the polynomial tail
    4/(rho^2*r)+(r-1)/(rho*n). Equal fibers of size r! identify the ordered
    injective sample with the exact uniform subset law. This tail suffices
    for the original limit; the stronger exponential finite tail,
    positive-fraction singular-value statement and growing-sparsity rates
    are not advertised. No numerical spectrum, floating-point calculation,
    unproved certificate, probabilistic oracle or new axiom is used.
