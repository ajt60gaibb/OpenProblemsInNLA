status:
  scope: >-
    For every fixed natural s >= 2, finite real C >= 1, natural sequences
    r and n with r_k <= k, r_k <= n_k, k/r_k tending to C and n_k/r_k
    tending to positive infinity, every deterministic matrix sequence
    eventually having entries in {-1,0,1} and exactly s nonzeros per column,
    and every eta > 0, the exact uniform r_k-subset probability of
    eta < smallestSingular tends to zero. Arbitrary signs, repeated column
    values and unrestricted support intersections are included.
