fidelity:
  divergences: The canonical original target is preserved without extra assumptions. A real extension
    of the half-line function is used, with proved independence of values below zero. The source residual
    theorem is connected to the stronger canonical premise by the actual PSD trace identity; no premise
    is silently substituted. The source negative-discriminant step is replaced by an exact sum of squares,
    and its pseudoinverse harmonic presentation by an actual diagonal quadratic test with zero-coordinate
    support proved first. The broader source claims listed above are not advertised as exports.
