version: v0.4
project:
  name: 'RA-09: concave-function transfer of Frobenius low-rank error'
  description: Complete affirmative proof of the original universal squared Frobenius transfer statement
    for ordered real PSD matrices and continuous concave nondecreasing nonnegative half-line functions.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: RA-09 — Concave-function transfer of Frobenius low-rank error
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/randomized-and-low-rank-approximation/RA-09/README.md
  type: web-post
  location: Complete retained original statement and canonical trace-deficit reduction
  relationship: formalizes
  author_endorsement: not-contacted
  note: Every n>=2, 1<=k<n, ordered pair of real symmetric PSD matrices, original half-line function,
    selected ordered orthonormal eigendecomposition and epsilon>=0. The premise is intentionally the difference
    of squared Frobenius norms; the original and function truncations share selected eigenvectors.
- title: Sharp Frobenius error transfer for monotone subhomogeneous matrix functions
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/references/colbrook-transfer-2026-09-11/manuscripts/02_frobenius_function_transfer.tex
  type: manuscript
  location: Theorem 1.1 and Sections 2–3,5, together with the canonical trace-deficit reduction; SourceCorrespondence.md
    and PROOF_MAP.md
  relationship: formalizes
  author_endorsement: not-contacted
  note: Colbrook retains mathematical authorship. The source proves a stronger ordinary-residual transfer
    result for a larger monotone-subhomogeneous class. This formalization proves the complete canonical
    concave-function implication through an internally proved trace-deficit bridge. The source broader
    function class, unordered factor two, sharpness, complex extension and k=n theorem are outside the
    seventeen exports.
- title: Algorithm-agnostic low-rank approximation of operator monotone matrix functions
  authors:
  - D. Persson
  - R. A. Meyer
  - C. Musco
  id: https://arxiv.org/abs/2311.14023v2
  type: preprint
  location: Table 1 Frobenius/concave/ordered cell, Theorem 2.5, Section 5 and equation (2)
  relationship: background
  author_endorsement: not-contacted
  note: Original question and same-basis truncation convention; no unproved transfer assertion from this
    source is assumed.
