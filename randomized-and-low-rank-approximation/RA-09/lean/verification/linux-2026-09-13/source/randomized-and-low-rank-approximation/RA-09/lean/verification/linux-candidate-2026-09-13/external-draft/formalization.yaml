alignment:
- declaration: NLA.RA09.frobenius_semantics
  scope: 'Every rectangular real matrix: entry-square sum equals the actual Mathlib Frobenius norm squared,
    the absolute-entry sum and trace of the transpose product; nonnegative and zero exactly for the zero
    matrix.'
- declaration: NLA.RA09.frobenius_orthogonal_invariance
  scope: Actual Frobenius squared norm is invariant under independent left and right real orthogonal changes
    of basis.
- declaration: NLA.RA09.orderedSpectral_exists
  scope: Every genuine real PSD matrix has complete decreasing orthonormal spectral data, including zero-dimensional
    auxiliary matrices.
- declaration: NLA.RA09.orderedSpectral_semantics
  scope: Every supplied ordered data object reconstructs the actual PSD matrix and supplies orthonormal
    eigenvectors; no preferred or simple eigenbasis is required.
- declaration: NLA.RA09.functionalCalculus_spectral
  scope: Actual real matrix CFC equals the spectral formula for every selected ordered decomposition and
    every function; values below zero are irrelevant.
- declaration: NLA.RA09.truncation_semantics
  scope: Actual same-basis truncation is PSD and bounded by the matrix, both Frobenius tails equal the
    exact sums, and ordinary truncation equals the matrix exactly when the discarded eigenvalues vanish.
- declaration: NLA.RA09.trace_deficit_reduction
  scope: For real PSD B below A, the exact Frobenius trace identity has nonnegative cross trace and derives
    residual error at most the difference of squared norms.
- declaration: NLA.RA09.admissible_scalar_consequences
  scope: The original half-line function class implies decreasing f(x)/x, nonnegative scaling, both threshold
    inequalities, the needed Lipschitz bound, and whole-half-line vanishing if f(tau)=0 for positive tau.
- declaration: NLA.RA09.scalar_branch_certificates
  scope: The exact quadratic sum of squares is strictly positive on the full unbounded domain d>=1,z>0,
    with all three closed-branch factor identities and their nonnegative signs.
- declaration: NLA.RA09.ordered_scalar_certificate
  scope: The complete ordered scalar inequality follows from the actual admissible function, positive
    tau,a,b and f(tau)>0; no branch inequality is assumed.
- declaration: NLA.RA09.harmonic_constraint
  scope: True diagonal-minus-rank-one PSD order, a nonnegative diagonal and a unit vector give zero-coordinate
    support and b times the harmonic sum at most one.
- declaration: NLA.RA09.overlap_semantics
  scope: Actual squared orthogonal-overlap entries are nonnegative, have unit column sums and bounded
    selected row sums; Ahat<=A derives all positive-column support and harmonic conditions.
- declaration: NLA.RA09.overlap_error_expansions
  scope: Both actual original and function Frobenius errors have the exact overlap expansions, including
    selected zero eigenvalues with positive f(0).
- declaration: NLA.RA09.zero_column_average
  scope: Nonnegative normalized weights and the actual half-line function class bound the full selected-zero-column
    f(0) contribution; the threshold may be any real number.
- declaration: NLA.RA09.positive_tail_transfer
  scope: At a positive actual first discarded eigenvalue, the full ordered excess inequality and scaled-tail
    inequality hold; f(tau)=0 is proved separately within the theorem.
- declaration: NLA.RA09.zero_tail_closure
  scope: Under the original trace-deficit premise and a zero first discarded eigenvalue, A equals Ahat_k
    and Ahat, and both actual function errors equal (n-k)f(0)^2 for arbitrary selected null-space bases.
- declaration: NLA.RA09.concaveFrobeniusTransferConjecture
  scope: Unconditional affirmative proof of the full original real ordered-PSD concave Frobenius-transfer
    implication, with its difference-of-squared-norms premise, every allowed basis and every nonnegative
    epsilon.
