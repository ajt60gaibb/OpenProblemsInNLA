    bf144a8ea84992d64f79f4425b18352843376286 passed actual non-root Linux sandboxed Comparator, separate
    default-kernel replay and isolation/rejection controls in run 34715563781 on 2026-09-12. An independent
    operational audit binds all 123 input files and original artifact digests. Canonical status is Lean
    verified. The source’s additional sampling and monotonicity results are outside these six formal exports.
    LeanCert supplies kernel trust auditing; no numerical interval certificate is claimed.
