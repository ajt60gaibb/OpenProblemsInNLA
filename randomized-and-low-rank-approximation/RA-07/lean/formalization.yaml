fidelity:
  divergences: Zero-based Fin labels represent the same original subsets, and the exact sequence is defined
    by ordinary real division. Actual finite subset sums prove e_0=1, oversized values zero and admissible
    denominator positivity. Mathlib Gauss–Lucas replaces the source’s Rolle argument, followed by actual
    real splitting and full root-multiset factorization; no real-rootedness, degree or factorization premise
    is added. Every original dimension, positive spectrum, repeated-root case and endpoint is included.
    The factor count for index j is n−(j−1), including two factors at j=n−1. The source’s additional index-one
    convexity, strict monotonicity, expectation identity and sampling consequences are outside the formal
    exports; this does not restrict the canonical target.
