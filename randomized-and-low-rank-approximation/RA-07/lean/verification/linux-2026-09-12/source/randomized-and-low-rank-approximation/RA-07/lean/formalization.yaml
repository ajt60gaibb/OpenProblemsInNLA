project:
  name: 'RA-07: convexity of the elementary-symmetric error sequence'
  description: Proves the complete canonical discrete-convexity assertion for (j+1)e_(j+1)/e_j over
    every positive real spectrum. Actual subset sums, polynomial derivatives, full root multiplicities
    and an exact nonnegative pair certificate connect the proof to the original ratios.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of
      Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: RA-07 — Convexity of the expected error of volume-sampled column subsets
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/randomized-and-low-rank-approximation/RA-07/README.md
  type: web-post
  location: Original scalar discrete-convexity question
  relationship: formalizes
  author_endorsement: not-contacted
  note: The complete target quantifies all dimensions n≥3, every strictly positive real tuple, and
    every index 2≤j≤n−1. The sampling interpretation motivates the scalar question; its expectation
    identity is not an additional formal export.
- title: Convexity of a volume-sampling error sequence
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/references/colbrook-transfer-2026-09-11/manuscripts/01_volume_sampling_convexity.tex
  type: manuscript
  location: Theorem 1.1 and its full convexity proof
  relationship: formalizes
  author_endorsement: not-contacted
  note: Formalizes the complete original convexity assertion. The manuscript’s strict monotonicity,
    extra index-one assertion, determinantal expectation identity, Jensen application and stable-rank
    bounds are outside the six advertised results. Mathematical proof attribution remains Colbrook.
