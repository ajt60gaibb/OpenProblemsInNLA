alignment:
- declaration: NLA.RA07.elementary_values
  scope: 'Actual elementary subset sums: empty and oversized cases, and positivity through the dimension.'
- declaration: NLA.RA07.generating_derivative_values
  scope: Actual generating-polynomial coefficients and iterated derivative values j! e_j for every
    natural index.
- declaration: NLA.RA07.positive_derivative_factorization
  scope: Unconditional factorization of every actual derivative of order d≤n, exact degree n−d, positive
    scale and positive reciprocal-root factors with multiplicity.
- declaration: NLA.RA07.power_sum_certificate
  scope: Strict denominator positivity and the exact nonnegative unordered-pair identity for every
    positive tuple of length at least two.
- declaration: NLA.RA07.second_difference_certificate
  scope: The actual original ratios at every canonical index equal 2 pairGap / certificateDenominator
    for an actual derivative factorization.
- declaration: NLA.RA07.errorSequence_convex
  scope: Complete affirmative canonical theorem for all n≥3, all strictly positive real tuples and
    every 2≤j≤n−1.
