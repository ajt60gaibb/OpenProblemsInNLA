automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement approvals before proof implementation;
      pinned Mathlib polynomial, finite-sum and Gauss–Lucas APIs; two independent final proof reviews
      with fresh separate-prefix re-elaboration; explicit LeanCert kernel trust assertions.
    prompting_notes: Preserve all positive spectra, all dimensions and original indices, repeated
      roots and endpoint cases. Prove actual derivative degree, real splitting and full-multiplicity
      factorization rather than assuming them. Replace repeated root isolation with actual Mathlib
      Gauss–Lucas and exact algebra. Prove both pair identities and all denominator signs. This purely
      algebraic and analytic argument has no interval calculation; LeanCert audits kernel trust, with
      no claimed numerical certificate.
  notes: AI-assisted formalization requested by George Stepaniants. The implementation agent is /root/solved_statement_inventory
    and is not counted as an independent referee. No external human peer review, source-author endorsement,
    unrecorded model identity, or measured monetary cost is claimed.
