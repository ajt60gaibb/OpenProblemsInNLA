project:
  name: 'RA-03: a counterexample to the randomized LU squared-error bound'
  description: Proves the genuine finite randomized LU process and its normalized history
    law, derives the actual singular-value tail and expected squared Frobenius error at an
    exact matrix witness, and refutes the full original universal bound.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: RA-03 — Improve the randomized LU squared-error factor to 2^k
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/randomized-and-low-rank-approximation/RA-03/README.md
  type: web-post
  location: Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Canonical randomized LU conjecture attributed to Gilles and Wilber, Algorithm 1 and
    the conjecture after Theorem 3.
- title: Sharp worst-case factors for randomly pivoted Cholesky and LU
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/references/colbrook-random-pivoting-2026-09-11/manuscripts/sharp_random_pivoting.tex
  type: manuscript
  location: Section 2, a two-dimensional RPLU counterexample
  relationship: formalizes
  author_endorsement: not-contacted
  note: The exact order-two, one-step counterexample completely refutes the canonical factor-2^k
    assertion. The stronger all-rank sharp factor-4^r theorem and Cholesky results are outside
    this formalization.
