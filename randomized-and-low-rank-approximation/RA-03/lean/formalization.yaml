fidelity:
  divergences: The finite expectation sums every complete pivot history with the product of
    its actual conditional masses. An absorbing label implements the zero-residual convention;
    zero-entry updates are totalized only on zero-mass choices. The explicitly scoped Frobenius
    norm is connected to the sum of squared complex moduli. The actual Mathlib singular-value
    sequence is decreasing and zero-based, so paper indices j>k become [k,min(m,n)). No matrix
    class, probability law or norm is replaced.
