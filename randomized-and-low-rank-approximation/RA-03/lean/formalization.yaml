automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents, two independent statement reviews before proof, analytic
      normalization of the full history law, exact matrix updates, actual Euclidean adjoint/characteristic-polynomial/singular-value
      bridges, and explicit kernel LeanCert for one rational point.
    prompting_notes: Preserve complex rectangular inputs, joint conditional entry sampling,
      zero absorption and all admissible ranks. Prove generic normalization and expectation
      recurrence by a finite equivalence and induction, computing only four updates and a
      two-root spectrum at the witness.
  notes: AI-assisted formalization requested by George Stepaniants. No external human peer
    review, source-author endorsement, unrecorded exact model identity or measured monetary
    cost is claimed.
