alignment:
- declaration: NLA.FR12.counting_semantics
  scope: Finiteness of the exact labeled real Hadamard subtype for every dimension and equivalence to
    Mathlib IsHadamard in positive dimension.
- declaration: NLA.FR12.injective_doubling
  scope: Hadamard validity and injectivity of the exact two-matrix/permutation construction for every
    positive order.
- declaration: NLA.FR12.factorial_doubling
  scope: The exact full-subtype cardinalities satisfy m! H(m)^2 ≤ H(2m) for every m≥1.
- declaration: NLA.FR12.power_two_nonempty
  scope: Actual nonempty labeled Hadamard matrix sets at every power-of-two order, including order one.
- declaration: NLA.FR12.power_two_lower_bound
  scope: The exact source lower bound H(2^(k+2)) ≥ 2^(2^(k+2) k(k+1)/8) for every natural k.
- declaration: NLA.FR12.counterexample
  scope: Every positive real proposed constant has a strict counterexample at some positive power-of-two
    multiple of four.
- declaration: NLA.FR12.not_countingConjecture
  scope: Unconditional negation of the complete original all-dimension labeled-matrix counting conjecture.
