automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement approvals before implementation, exact pinned
      Mathlib matrix/cardinality/factorial/real-power APIs, two independent final referees with separate
      fresh artifact prefixes, and actual LeanCert kernel trust assertions.
    prompting_notes: Preserve the complete original all-dimension and all-positive-real-constant conjecture.
      Prove actual finite subtype semantics and injectivity, not assumed family cardinalities. Restrict
      only the constructed matching family to m! choices, retain the exact source lower bound, and use
      direct exponential induction and Archimedean choice. Avoid large enumeration, approximate logarithms
      or decorative interval certificates.
  notes: Substantial AI assistance requested by George Stepaniants. The implementation agent /root is
    not counted as an independent referee. Independent reviewers are /root/formal_review_standards and
    /root/leancert_examples. No external human peer review, official Tau Ceti endorsement, unrecorded
    model identity, monetary-cost measurement or historical-priority certification is claimed.
