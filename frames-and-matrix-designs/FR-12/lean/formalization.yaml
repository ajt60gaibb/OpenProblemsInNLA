version: v0.4
project:
  name: 'FR-12: a labeled Hadamard counting counterexample'
  description: Proves a complete negative answer to the original labeled real Hadamard counting conjecture.
    A genuine finite matrix subtype and an injective restricted doubling construction give m! H(m)^2 ≤
    H(2m), the exact source power-of-two lower bound, and a counterexample for every positive real constant.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: FR-12 — Counting real Hadamard matrices
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/frames-and-matrix-designs/FR-12/README.md
  type: web-post
  location: Complete original Statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Retains the individual labeled sign-matrix count, arbitrary positive real C, every positive natural
    dimension divisible by four and the genuine base-two logarithm. The original source is informally
    Solved. Its complete target now has actual independently audited Linux Lean verification at revision
    3e20bae9a07b1a33db8fdfb18bdebb9e590071a9.
- title: 'FR-12: A matching-indexed doubling counterexample'
  authors:
  - George Stepaniants
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/frames-and-matrix-designs/FR-12/solution.md
  type: manuscript
  location: Exact target, Lemma 1 and Theorem 1
  relationship: adapts
  author_endorsement: participated
  note: George supplied the mathematical manuscript and requested its formalization. This records source-author
    participation, not external human peer review or endorsement of a completed Linux result. The formal
    construction uses only top-to-bottom matchings, giving m! instead of the source’s stronger (2m−1)!!
    recurrence; it still proves the identical quantitative lower bound and full original negation. Direct
    induction on real exponentials avoids logarithms of the count.
- title: On the number of Hadamard matrices via anti-concentration
  authors:
  - Asaf Ferber
  - Vishesh Jain
  - Yufei Zhao
  id: https://doi.org/10.1017/S0963548321000377
  type: article
  location: Published Conjecture 1.3 and Theorem 1.2
  relationship: background
  author_endorsement: not-contacted
  note: Original counting conjecture and published upper-bound attribution. No unproved external theorem
    is assumed by the Lean proof.
