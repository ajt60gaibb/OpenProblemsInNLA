fidelity:
  divergences: The count is the actual labeled real sign-matrix subtype, with an unconditional finiteness
    proof; no quotient or normalization is used. The n=0 definition extends the count harmlessly while
    the conjecture retains only positive dimensions. A restricted top/bottom matching injection proves
    m! H(m)^2 ≤ H(2m), not the stronger informal (2m−1)!! factor. The exact source lower bound and complete
    original target negation remain unchanged. The index K=k+2 avoids truncated natural subtraction; the
    inner exponent is natural and outer exponent real. The sole public source-signature variation is alpha-renaming
    the unused hn binder to _hn in counting_semantics, retaining its premise. The frozen Challenge itself
    is unchanged.
