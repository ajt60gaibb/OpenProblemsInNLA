version: v0.4
project:
  name: 'FR-05: vanishing complex phase-retrieval injectivity probability'
  description: >-
    A locally Lean-checked proof of p_d <= C/d for every d >= 2 and the
    original limit p_d -> 0, for iid standard complex-Gaussian 4d-5 row
    frames and all-signals phase-retrieval injectivity. Includes the planted
    probability bound, likelihood comparison, exact sampler identities, and
    final assembly. Independent review and isolated verification are pending.
  authors:
  - OpenAI Codex AI
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: 'FR-05: probability of phase-retrieval injectivity'
  id: ../README.md
  type: web-post
  location: Canonical problem statement
  relationship: formalizes
  author_endorsement: n/a
  note: >-
    The permanent problem number, canonical target, source credit, and
    solution-claimed catalog status are unchanged. Both the original limit
    and the manuscript's stronger quantitative bound are proved locally,
    without assuming the intermediate analytic estimates.
- title: "Resolution of Vinzant's Conjecture on Phase Retrieval Injectivity"
  authors:
  - Zhangsong Li
  id: https://zhangsong-li.github.io/injectivity_phase_retrieval.pdf
  type: manuscript
  location: Theorem 1.4; Sections 2--3, especially Propositions 3.1 and 3.2
  relationship: adapts
  author_endorsement: not-contacted
  note: >-
    Retrieved and hash-frozen as sources/injectivity_phase_retrieval.pdf.
    Propositions 3.1 and 3.2 and the sampler-to-likelihood bridges are proved,
    rather than postulated. The proof adapts some intermediate arguments;
    see the source map and fidelity notes below.
