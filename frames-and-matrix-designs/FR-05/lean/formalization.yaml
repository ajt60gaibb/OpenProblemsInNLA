verification_plan:
  permitted_axioms:
  - propext
  - Classical.choice
  - Quot.sound
  definition_names: []
  note: >-
    The exact signatures are duplicated in Challenge solely for future
    Comparator checking. Challenge contains four isolated deliberate
    placeholders and is not imported by Solution. A fresh non-root Linux
    Comparator run, statement review, source-to-definition audit, and proof
    review remain outstanding.
fidelity:
  divergences: >-
    The original probability law, all-signals predicate, dimensions, and
    final quantifiers are retained. The planted proof uses an exactly
    quadratic factor chart and a frozen-Jacobian contraction, avoiding a
    separate perturbed inverse. A measurable row-distance event replaces
    the need for a measurable choice of unit normal. Weaker intermediate
    small-ball estimates suffice for the same O(M^-2) planted bound.
    Elementary phase and exponential estimates are simplified without
    changing the final statements. No claim of new mathematical priority
    or an independently audited line-by-line equivalence is made.
review:
  status: unchecked
  notes: >-
    No independent statement or proof review has been requested or completed.
