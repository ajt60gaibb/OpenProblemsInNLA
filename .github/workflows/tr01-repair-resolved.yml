name: Repair TR-01 resolution archive

on:
  push:
    branches:
      - tr01-prescribed-width-resolution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tr01-prescribed-width-resolution
          fetch-depth: 0
      - name: Patch RESOLVED.md
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RESOLVED.md')
          s = p.read_text()
          start = s.index('<a id="tr-01"></a>')
          end = s.index('<a id="ie-01"></a>', start)
          before, block, after = s[:start], s[start:end], s[end:]
          old_formula = r'\Pr\left\{\|V^T\Omega^T\Omega V-I_r\|_2\le\varepsilon\right\}\ge0.99.'
          new_formula = r'\Pr\left\{\|V^T\Omega\Omega^T V-I_r\|_2\le\varepsilon\right\}\ge0.99.'
          assert block.count(old_formula) == 1, block.count(old_formula)
          block = block.replace(old_formula, new_formula)
          old_a = 'The catalog checked the corresponding Lean declarations'
          new_a = 'The submitted verification package identifies the corresponding Lean declarations'
          assert block.count(old_a) == 1, block.count(old_a)
          block = block.replace(old_a, new_a)
          old_b = 'against the catalog target. Reproducible evidence includes `lean/audit/final_candidate_correspondence.md`, `lean/audit/final_candidate_correspondence.json`, `lean/audit/delivery_check.json`, `lean/audit/cold_rebuild.json`, `lean/audit/fresh_kernel_replay.json`, `lean/audit/semantic_regressions.json`, and `lean/audit/final_binding_review.json`. The axiom audit accepts only `propext`, `Classical.choice`, and `Quot.sound`. This catalog did not rerun Lean locally; it validated public verification records and declaration correspondence.'
          new_b = 'and includes an independent manuscript-to-Lean statement-correspondence review. Reproducible evidence is linked from the canonical TR-01 page and the immutable public revision. The axiom audit accepts only `propext`, `Classical.choice`, and `Quot.sound`. This upstream submission does not claim that the OpenProblemsInNLA maintainers reran Lean locally. See the canonical TR-01 page for the pinned reproduction commands and complete verification-evidence links.'
          assert block.count(old_b) == 1, block.count(old_b)
          block = block.replace(old_b, new_b)
          p.write_text(before + block + after)
          PY
          git diff -- RESOLVED.md
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tr01-repair-resolved.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RESOLVED.md
          git diff --cached --check
          git commit -m 'Repair TR-01 resolution archive wording'
          git push origin HEAD:tr01-prescribed-width-resolution
