name: Repair TR-01 resolution archive

on:
  push:
    branches:
      - tr01-prescribed-width-resolution

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tr01-prescribed-width-resolution
          fetch-depth: 0

      - name: Repair only the TR-01 block in RESOLVED.md
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RESOLVED.md')
          s = p.read_text()
          start = s.index('<a id="tr-01"></a>')
          end = s.index('<a id="ie-01"></a>', start)
          before = s[:start]
          block = s[start:end]
          after = s[end:]

          old_formula = r'\Pr\left\{\|V^T\Omega^T\Omega V-I_r\|_2\le\varepsilon\right\}\ge0.99.'
          new_formula = r'\Pr\left\{\|V^T\Omega\Omega^T V-I_r\|_2\le\varepsilon\right\}\ge0.99.'
          if block.count(old_formula) != 1:
              raise SystemExit(f'expected exactly one old Gram formula, found {block.count(old_formula)}')
          block = block.replace(old_formula, new_formula)

          old_para = '''The public Lean repository is immutable revision [`ed211811`](https://github.com/yuningyang19/OpenProblemsInNLA_TR-01/tree/ed21181197ac839eac95f549404f94e7e3aa6e10), with toolchain `lean 4.33.0`, `mathlib` commit `db584cd6d46c92f209a44c0f1c829460d327499d`. The catalog checked the corresponding Lean declarations

- `Problem56.PaperV7.certified_main`
- `Problem56.PaperV7.certified_explicit_main`
- `Problem56.PaperV7.main_prescribed_width_ose`

against the catalog target. Reproducible evidence includes `lean/audit/final_candidate_correspondence.md`, `lean/audit/final_candidate_correspondence.json`, `lean/audit/delivery_check.json`, `lean/audit/cold_rebuild.json`, `lean/audit/fresh_kernel_replay.json`, `lean/audit/semantic_regressions.json`, and `lean/audit/final_binding_review.json`. The axiom audit accepts only `propext`, `Classical.choice`, and `Quot.sound`. This catalog did not rerun Lean locally; it validated public verification records and declaration correspondence.

'''
          new_para = '''The public Lean repository is immutable revision [`ed211811`](https://github.com/yuningyang19/OpenProblemsInNLA_TR-01/tree/ed21181197ac839eac95f549404f94e7e3aa6e10), with toolchain `lean 4.33.0` and `mathlib` commit `db584cd6d46c92f209a44c0f1c829460d327499d`. The submitted verification package identifies the corresponding Lean declarations

- `Problem56.PaperV7.certified_main`
- `Problem56.PaperV7.certified_explicit_main`
- `Problem56.PaperV7.main_prescribed_width_ose`

and includes an independent manuscript-to-Lean statement-correspondence review. Reproducible evidence is linked from the canonical TR-01 page and the immutable public revision. The axiom audit accepts only `propext`, `Classical.choice`, and `Quot.sound`. This upstream submission does not claim that the OpenProblemsInNLA maintainers reran Lean locally. See the canonical TR-01 page for the pinned reproduction commands and complete verification-evidence links.

'''
          if block.count(old_para) != 1:
              raise SystemExit(f'expected exactly one old verification paragraph, found {block.count(old_para)}')
          block = block.replace(old_para, new_para)

          p.write_text(before + block + after)
          PY

      - name: Remove this temporary workflow and commit the repair
        run: |
          git rm .github/workflows/tr01-repair-resolved.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESOLVED.md
          git diff --cached --check
          git commit -m "Repair TR-01 resolution archive wording"
          git push origin HEAD:tr01-prescribed-width-resolution
