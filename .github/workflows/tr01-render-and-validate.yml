name: Regenerate and validate TR-01 artifacts

on:
  push:
    branches:
      - tr01-prescribed-width-resolution

permissions:
  contents: write

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tr01-prescribed-width-resolution
          fetch-depth: 0

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-texgyre

      - name: Regenerate catalog and TR-01 document
        run: |
          python3 tools/validate_problem_ids.py --base-ref HEAD~4 || python3 tools/validate_problem_ids.py
          python3 tools/update_catalog.py
          python3 tools/render_problems.py TR-01

      - name: Run repository status and ID tests
        run: |
          python3 -m unittest discover -s tests -p 'test_problem_ids.py' -v
          python3 -m unittest discover -s tests -p 'test_problem_statuses.py' -v
          git diff --check

      - name: Check repaired TR-01 content
        run: |
          set -eu
          ! grep -R -n -F 'V^T\Omega^T\Omega V' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex RESOLVED.md
          grep -R -n -F 'V^T\Omega\Omega^T V' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex RESOLVED.md
          ! grep -R -n -F 'lean/build/verification.json' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex RESOLVED.md
          ! grep -R -n -E 'affine preprint|arXiv-style full text|same probabilistic target|The catalog checked|This catalog checked' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex RESOLVED.md
          grep -R -n -F 'python3 verify.py --graph --semantic --fresh-kernel' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex
          grep -R -n -F 'final_binding_review.json' randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex

      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git rm .github/workflows/tr01-render-and-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CATALOG.md RESOLVED.md randomized-and-low-rank-approximation/README.md randomized-and-low-rank-approximation/TR-01/README.md randomized-and-low-rank-approximation/TR-01/problem.tex randomized-and-low-rank-approximation/TR-01/problem.pdf
          git diff --cached --check
          git commit -m 'Regenerate and validate TR-01 Lean-verified artifacts'
          git push origin HEAD:tr01-prescribed-width-resolution
