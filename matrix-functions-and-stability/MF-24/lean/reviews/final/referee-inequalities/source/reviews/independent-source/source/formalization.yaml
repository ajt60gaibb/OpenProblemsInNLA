automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: >-
      Multiple problem agents. Source inspection and statement drafting on
      macOS. The coordinator manages remote non-root Linux typechecks and
      proof builds. No local Lean, Lake or cache downloads are authorized.
    prompting_notes: >-
      State all numerical and general obligations before proof bodies. Preserve
      every complex shift, ordered singular-value multiplicity and zero, actual
      operator norms, actual complex polynomial evaluation and unbounded
      dimensions. Use generic finite recurrences and exact 2×2 algebra; avoid
      growing determinant expansion, interval subdivisions and numerical SVDs.
      Require LeanCert kernel trust for every eventual export.
  notes: >-
    AI-assisted statements by /root/next_matrix_functions. Two independent
    statement reviews and remote Linux elaboration are still pending; no proof
    body is implemented. No official Tau Ceti endorsement, external human peer
    review, source-author endorsement or mathematical novelty claim is asserted.
status:
  scope: >-
    Statement-only draft: twenty-two deliberate Challenge goals, definitions,
    exact numerical obligations and pinned tooling. No Solution implementation
    exists. No independent statement approval, Linux typecheck, frozen boundary,
    kernel proof acceptance, Comparator result or verified-count increment is
    claimed. The full original target is intended; the additional sharper
    quantitative statements and the source's padding corollary are not claimed.
  main_results: []
fidelity:
  divergences: >-
    No restriction of the original negative comparison target. The denominator
    estimate is deliberately weakened from t²+m−1 to t²+m, and the finite-family
    ratio from (4/5)sqrt(m) to (2/3)sqrt(m), to retain full residue classes and
    remove boundary-deletion isometries. Scalar identities at every complex η
    replace matrix-valued polynomial expressions. The source's all-dimension
    padding lower bound, liminf result and sharp constants are not formalized.
review:
  status: unreviewed statement-only draft; all proof and final mechanical gates pending
  reviewers: []
  notes: >-
    Challenge placeholders are intentional statement goals and prove no
    mathematics. Two independent statement reviewers, actual Linux typechecking
    and an immutable freeze are required before proof implementation. Later
    acceptance requires LeanCert kernel trust, transitive axiom audit, actual
    Comparator with no definition holes, default-kernel replay, negative
    controls and two independent final referees applying scoped Tau Ceti
    fidelity, proof-quality, reuse and attribution standards.
alignment:
  source_correspondence: SourceCorrespondence.md
  numerical_boundary: NUMERICAL_TARGETS.md
  proposed_statements: Challenge.lean
  source_provenance: SOURCE-PROVENANCE.json
  intended_implementation_entry: Solution.lean
acknowledgements: >-
  Georg Maierhofer for the original mathematical counterexample; Fortier Bourque
  and Ransford for the original problem; Mathlib contributors for the matrix,
  Hermitian spectrum, singular-value and Euclidean norm APIs; LeanCert and
  Comparator contributors for trust and independent statement checking. Their
  mathematical and software credit is distinct from formalization authorship.
