fidelity:
  divergences: No restriction of the original negative comparison target. The denominator estimate is deliberately
    weakened from t²+m−1 to t²+m, and the finite-family ratio from (4/5)sqrt(m) to (2/3)sqrt(m), to retain full
    residue classes and remove boundary-deletion isometries. Scalar identities at every complex η replace matrix-valued
    polynomial expressions. The source's all-dimension padding lower bound, liminf result and sharp constants are
    not formalized.
