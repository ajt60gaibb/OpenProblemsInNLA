automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple problem agents. Source inspection and statement drafting on macOS. The coordinator manages
      remote non-root Linux typechecks and proof builds. No local Lean, Lake or cache downloads are authorized.
    prompting_notes: State all numerical and general obligations before proof bodies. Preserve every complex shift,
      ordered singular-value multiplicity and zero, actual operator norms, actual complex polynomial evaluation
      and unbounded dimensions. Use generic finite recurrences and exact 2×2 algebra; avoid growing determinant
      expansion, interval subdivisions and numerical SVDs. Require LeanCert kernel trust for every eventual export.
  notes: Substantial Codex assistance. Definitions and principal implementation by /root/next_matrix_functions;
    generic determinant/transfer implementation contributions by /root/next_elimination. Independent full mathematical
    source reviewers /root and /root/next_inequalities contributed no mathematical proof code. Frozen statements
    were independently approved before implementation. Canonical Linux checking is pending; no local Lean, official
    Tau Ceti endorsement, external human peer review or novelty claim.
