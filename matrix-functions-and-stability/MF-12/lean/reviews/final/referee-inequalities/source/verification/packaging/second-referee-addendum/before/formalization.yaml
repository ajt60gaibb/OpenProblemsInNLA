  location: Complete original problem statement and retained resolution
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, original every-real-exponent target, full finite family, all lengths and true Euclidean
    norm are preserved.
- title: An explicit pair realizing every marginal polynomial growth exponent
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/references/colbrook-jsr-growth-2026-09-11/manuscripts/arbitrary_growth_exponents.tex
  type: manuscript
  location: Theorem1 and its proof in sections2–5
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original mathematical author is Matthew J. Colbrook, Department of Applied Mathematics and Theoretical
    Physics, University of Cambridge. Formalization credit belongs to George Stepaniants. Sharper constants
    and the optional rational-entry and density corollaries are not proposed claims.
- title: On marginal growth rates of matrix products
  authors:
  - J. Varney
  - I. D. Morris
  id: https://doi.org/10.1016/j.laa.2025.01.013
  type: article
  location: Question2, as cited by the retained canonical statement
  relationship: background
  author_endorsement: not-contacted
  note: No unproved mathematical result from this source is an intended assumption.
