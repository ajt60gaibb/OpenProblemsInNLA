version: v0.4
project:
  name: 'MF-12: realizing every nonnegative polynomial growth exponent'
  description: Complete compiled proof candidate for every nonnegative real polynomial growth exponent
    using a fixed positive-dimensional real matrix pair, all words at every positive length, genuine Euclidean
    operator norm and the actual nth-root limit one.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: The exact proof graph compiled at a1efcbfc59263b9e5bb00914ee709112348c1e54 in Linux development
    run 35034380090. This standalone candidate awaits its canonical check.
