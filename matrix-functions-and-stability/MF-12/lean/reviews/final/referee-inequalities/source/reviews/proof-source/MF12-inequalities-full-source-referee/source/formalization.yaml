automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: >-
      Multiple problem agents; source drafting on macOS; the coordinator manages
      later non-root Linux statement elaboration and proof builds. No local
      Lean/Lake execution or dependency/cache download is authorized.
    prompting_notes: >-
      State the full target before proofs. Retain all words, all positive
      lengths, all nonnegative real exponents, actual attained maxima, genuine
      Euclidean norms and actual nth-root convergence. Use sparse block algebra,
      finite Holder, exact Bernoulli constants and dimension-factor norm
      comparisons to remove unnecessary computation. Require LeanCert kernel
      trust for every eventual export and independent Comparator with no holes.
  notes: >-
    AI-assisted statement draft by /root/next_matrix_functions. No proof body,
    independent approval or Lean execution is claimed. No official Tau Ceti
    endorsement, external human peer review or source-author endorsement is claimed.
status:
  scope: >-
    Proof-free definitions and28 deliberate Challenge goals only. The complete
    canonical target is proposed; no proof implementation, frozen boundary,
    actual kernel acceptance, Comparator result or verified-count increment exists.
  main_results: []
fidelity:
  divergences: >-
    The unchanged six-dimensional source pair uses lambda=1/4. For 0<alpha<1,
    the proposed constants are c=lambda^alpha/10 and C=1728/(1-mu)^2. Exact
    Bernoulli estimates replace exponential constants, and entry-max comparisons
    replace exact spectral-norm Kronecker multiplicativity with sufficient fixed
    dimension factors. These change constants only. No rational-entry, density,
    sharper-constant or minimal-dimension corollary is proposed.
review:
  status: unreviewed statement-only draft; all proof and mechanical gates pending
  reviewers: []
  notes: >-
    Two independent statement reviews and actual Linux elaboration are required
    before freezing statements and implementing any proof. Final acceptance
    requires two independent referees applying scoped Tau Ceti fidelity,
    proof-quality, reuse and attribution requirements, all LeanCert kernel
    assertions, permitted-axiom audit, Comparator, default-kernel replay and
    negative controls. An author self-check or finite numerical check is insufficient.
alignment:
  source_correspondence: SourceCorrespondence.md
  numerical_boundary: NUMERICAL_TARGETS.md
  proposed_statements: Challenge.lean
