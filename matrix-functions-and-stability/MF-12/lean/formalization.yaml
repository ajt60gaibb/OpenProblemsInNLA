fidelity:
  divergences: The unchanged six-dimensional source pair uses lambda=1/4. For 0<alpha<1, the proved sufficient
    constants are c=lambda^alpha/10 and C=1728/(1-mu)^2. Exact Bernoulli estimates replace exponential constants,
    and entry-max comparisons replace spectral-norm Kronecker multiplicativity with proved fixed dimension
    factors. These change constants only and preserve every positive length, real exponent, true norm, actual
    family maximum and root limit. No optional rational-entry, density, sharper-constant or minimal-dimension
    corollary is claimed.
review:
  status: accepted by two independent non-implementing AI-agent final mathematical and actual-runtime referees
  reviewers:
  - /root (independent statement referee)
  - /root/next_elimination (independent statement and mathematical-source/evidence referee; metadata packager
    only)
  - /root/next_inequalities (independent complete mathematical source referee; no MF-12 implementation contribution)
  notes: Two independent statement approvals and actual Linux elaboration preceded the immutable mathematical
    freeze. All original source reviews, proof-only repair addenda and development records remain unchanged.
    Final reports in reviews/final independently reconcile all 322 actual candidate inputs, all 28 targets and
    all canonical controls at 3d06c49635bbdde109c491510641204285eaf05c. Scoped Tau Ceti adaptation, not official
    endorsement or human peer review. The elimination referee prepared metadata/evidence only; no mathematical
    source was changed.
