version: v0.4
project:
  name: 'MF-12: realizing every nonnegative polynomial growth exponent'
  description: Complete formally checked proof for every nonnegative real polynomial growth exponent using
    a fixed positive-dimensional real matrix pair, all words at every positive length, genuine Euclidean operator
    norm and the actual nth-root limit one.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: All 28 targets accepted at immutable proof commit 3d06c49635bbdde109c491510641204285eaf05c by canonical
    non-root Linux run 35037011332 and two independent final mathematical/runtime referees. Publication and
    merge commits require their own exact-commit executions.
sources:
- title: MF-12 — Realizing arbitrary polynomial growth exponents by finite matrix families
