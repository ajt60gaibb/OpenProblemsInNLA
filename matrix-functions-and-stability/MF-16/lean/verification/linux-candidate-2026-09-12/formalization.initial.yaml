  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/references/colbrook-matrix-functions-2026-09-11/manuscripts/MF-16.tex
  type: manuscript
  location: Theorem 1, with the matrix-entry recovery idea from Theorem 4; see SourceCorrespondence.md
    and verification/PROOF_MAP.md
  relationship: formalizes
  author_endorsement: not-contacted
  note: Colbrook retains mathematical authorship and the unchanged B,P,X0. A new exact three-variable
    radius 10^-7 certificate proves one additional solution, sufficient for the complete negative answer.
    Three roots, the degree theorem, exponent-family thresholds and priority are outside the nine exports.
