sources:
- title: MF-16 — Uniqueness of positive definite solutions of two-letter word equations in order two
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/5830ed4fb06da0659414a3deb2a40ad327aca052/matrix-functions-and-stability/MF-16/README.md
  type: web-post
  location: Complete retained original Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Every finite ordinary two-letter palindrome containing X and every complex Hermitian positive
