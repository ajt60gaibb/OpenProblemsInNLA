fidelity:
  divergences: No narrowing of the full original universal uniqueness target being negated. The witness
    is the unchanged X B X^12 B X and unchanged integer matrices. The formalization adapts the root certificate
    to three independent variables with a radius 10^-7 box; it does not use the source two-dimensional
    radius 10^-40 boxes or assume inverse-expression automatic differentiation. One additional solution
    suffices; the source stronger three-solution and family-threshold claims are not exported.
