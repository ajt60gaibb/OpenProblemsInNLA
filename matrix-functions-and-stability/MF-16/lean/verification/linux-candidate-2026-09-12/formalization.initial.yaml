alignment:
- declaration: NLA.MF16.word_semantics
  scope: The actual ordinary palindrome has 16 letters, 14 occurrences of X and two of B, and evaluates
    in written order to X B X^12 B X over both real and complex matrices.
- declaration: NLA.MF16.source_data
  scope: The unchanged integer B, P and X0 are genuinely complex Hermitian positive definite, the actual
    word at X0 equals P, and their exact determinants are proved.
- declaration: NLA.MF16.twelfth_power_reduction
  scope: For every symmetric real 2 by 2 matrix of determinant three, the actual twelfth matrix power
    equals the explicit trace-polynomial linear combination of the matrix and identity; Cayley-Hamilton
    is proved and applied internally.
- declaration: NLA.MF16.polynomial_word_equivalence
  scope: For every real triple, the actual LeanCert Expr system is zero if and only if determinant three
    and the two stated actual matrix word-entry equations hold; no determinant or power-reduction premise
    is supplied.
- declaration: NLA.MF16.krawczyk_certificate
  scope: The actual complete Krawczyk checker accepts the exact rational box and certificate, and the
    actual preconditioner determinant, box radius and whole-box contraction bound below 27/1000 are proved
    by kernel reduction.
- declaration: NLA.MF16.certified_root
  scope: An actual unique real zero of the polynomial system exists inside the stated box, by the retained
    LeanCert Krawczyk soundness proof. This local uniqueness is distinct from the disproved global matrix-word
    uniqueness.
- declaration: NLA.MF16.root_to_matrix
  scope: Every system zero inside the actual box gives x>3, genuine complex Hermitian positive definiteness,
    the complete all-entry matrix word equality, and a matrix different from X0.
- declaration: NLA.MF16.counterexample
  scope: The actual palindrome and complex Hermitian positive definite B,P have at least two distinct
    complex Hermitian positive definite solutions, one the unchanged X0.
- declaration: NLA.MF16.not_wordUniquenessConjecture
  scope: Unconditional negation of the complete original all-ordinary-palindromes, all-complex-Hermitian-positive-definite
    B,P, order-two universal uniqueness conjecture.
