  "fidelity": {
    "divergences": "No target weakening. Actual CFC natural logarithm, Gram-square-root trace norm and complex trace normalization are used. C10 constructs M=norm(rho)+norm(sigma)+1 and R=1+M/epsilon instead of the numerical plan suggestion R=1+1/epsilon; the frozen existential statement is unchanged. C09 uses endpoint optimizers and a mean-value argument. C11 internally proves the ordinary noncommuting entropy identity with product integrability before Fubini; C12 truncates before substitution. Repeated eigenvalues, zero commutators and degenerate cutoff R=1 are included. Source order-two optimality remains outside the advertised formal target."
  },
