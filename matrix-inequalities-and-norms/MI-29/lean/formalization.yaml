automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents, two independent statement reviews before proof, actual Mathlib
      CFC/order/invertibility interfaces, exact matrix certificates, and explicit kernel LeanCert
      for one rational point.
    prompting_notes: Keep all complex matrices and nonnegative real exponents in the original
      target. Derive actual modulus eighth powers analytically, use repeated squaring and exact
      3-by-3 determinants, and prove every witness hypothesis as a conclusion.
  notes: AI-assisted formalization requested by George Stepaniants. No external human peer review,
    source-author endorsement, unrecorded exact model identity or measured monetary cost is claimed.
