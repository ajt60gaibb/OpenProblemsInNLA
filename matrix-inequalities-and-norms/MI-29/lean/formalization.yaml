version: v0.4
project:
  name: 'MI-29: a counterexample to the modulus-order determinant comparison'
  description: Proves genuine continuous-functional-calculus bridges, positive-real determinant
    semantics, an admissible exact complex-matrix witness, and the negation of the full original
    conjecture with arbitrary nonnegative real exponents.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: MI-29 — Modulus-order determinant comparison with an arbitrary base power
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/matrix-inequalities-and-norms/MI-29/README.md
  type: web-post
  location: Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: 'Canonical complex-matrix conjecture attributed to M. M. Ghabries: A positive definite,
    B invertible Hermitian, and arbitrary real k,p at least zero.'
- title: 'MI-29: Resolution'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/matrix-inequalities-and-norms/MI-29/solution.tex
  type: manuscript
  location: Theorem 1.1 and its proof
  relationship: formalizes
  author_endorsement: not-contacted
  note: The rational dimension-three witness at k=6,p=8 refutes the complete canonical target.
    Separate singular-input extensions, the established k=2 case, and positive-B variants are
    outside this formalization.
related_formalizations:
