fidelity:
  divergences: Finite indices are zero-based. Spectral powers use actual unital CFC.rpow, including
    exponent zero; matrix modulus is actual CFC.abs, with its square-root identity proved. ComplexOrder
    compares real parts at equal imaginary parts, and the generic positive-real determinant theorem
    justifies the comparison. No positivity restriction on B, integer-only exponent restriction,
    commutation, assumed spectral data, or extra numerical hypothesis is introduced. The source
    singular-input extension and restricted k=2 or positive-B statements are not asserted.
review:
  status: agent-reviewed; Linux-Comparator-passed
  reviewers:
  - 'OpenAI Codex agent /root: independent statement referee 1 and final proof referee 1'
  - 'OpenAI Codex agent /root/formal_review_standards: independent statement referee 2 and final
    proof referee 2'
  notes: Both statement reports bind the frozen definitions and Challenge and precede proof implementation.
    Both final proof referees independently re-elaborated the actual Definitions, Proof and Solution
    locally on macOS; their raw logs and axiom audits are retained in verification/referee-1/
    and verification/referee-2/. The proof implementer does not count as an independent referee.
    Relevant Tau Ceti rubrics are adapted to this canonical target. Five deliberate Challenge
    placeholders are excluded from proof sorry counts and never imported by Solution. Source-level
    signature identity has been checked; the actual isolated Linux Comparator, sandbox and negative
    controls passed in run 34706412510. The independent operational audit checked both original
    artifact digests, the exact 70-input set and all executed control and export phases. Linux
    ran remotely on GitHub Actions; its evidence was reviewed locally on macOS.
    Historical statement-stage records are preserved and superseded on
    proof completion by the final proof reviews. Mechanical formal identity does not replace informal
    fidelity review.
  verification_run: https://github.com/sgstepaniants/OpenProblemsInNLA/actions/runs/34706412510
  verified_proof_commit: c0c5eced77d2528f37d931200248fc54a190813e
  evidence: verification/linux-2026-09-12/OPERATIONAL-REVIEW.md
