- title: MI-07 — The triangle conjecture for the maximal symmetric modulus
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/matrix-inequalities-and-norms/MI-07/README.md
  type: web-post
  location: Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
