  location: Theorem 1.1 and its proof, specialized to t=5/12 for the original constant-one target
  relationship: formalizes
  author_endorsement: not-contacted
  note: The rational specialization of the source family proves the complete original negative answer.
    The stronger source theorem excluding every finite domination constant is outside this formalization.
