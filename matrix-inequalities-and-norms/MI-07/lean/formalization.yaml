fidelity:
  divergences: Finite indices are zero-based and the positive integer root index is r+1. Modulus
    is actual CFC.abs and every outer power is genuine CFC.rpow. The totalized Filter.limUnder is
    identified only from proved convergence at every invoked witness matrix; no convergence assumption
    weakens the original conjecture. The generic norm bridge uses the actual L2 operator norm and
    ordinary finite-dimensional topology. The singular projection uses strictly positive exponent
    identities, not its unital exponent-zero value. Ordinary PSD order and every arbitrary complex
    unitary are retained. Generic convergence for unrelated matrices and the source stronger no-finite-constant
    theorem are not claimed.
review:
  status: agent-reviewed; Linux-Comparator-pending
  reviewers:
  - 'OpenAI Codex agent /root/solved_statement_inventory: independent statement referee 1 and final
    proof referee 1'
  - 'OpenAI Codex agent /root: independent statement referee 2 and final proof referee 2'
  notes: The two statement reviews bind Definitions, Challenge and numerical targets before proof
    implementation. Both final proof reviewers independently re-elaborated the actual Definitions,
    FunctionalCalculus, Proof and Solution into fresh local artifacts; their raw commands, axiom
    audits, exact reconstructions and actual certificate inspections are retained. The proof implementer
    does not count as an independent referee. Relevant Tau Ceti rubrics are adapted to this complete
    canonical target. Seven deliberate Challenge placeholders are excluded from proof-development
    sorry counts and are never imported by Solution. All seven source-level signatures match; this
    does not replace the pending real Linux Comparator, actual sandbox controls and default-kernel
    replay. Historical statement-stage notes remain as chronological evidence. Mechanical formal
    identity does not replace prose-to-Lean fidelity review.
  evidence: reviews/proof-referee-1.md and reviews/proof-referee-2.md
