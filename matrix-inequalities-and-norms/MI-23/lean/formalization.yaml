alignment:
- declaration: NLA.MI23.positive_powers_and_means
  scope: Genuine positive definiteness of all real CFC powers and generalized means, including zero and
    negative exponents.
- declaration: NLA.MI23.product_eigenvalue_semantics
  scope: Explicit invertible similarity for every complex positive-definite product, with actual root
    multiplicities, reality, positivity, dimension, order and determinant product.
- declaration: NLA.MI23.squared_product_largest
  scope: Actual first characteristic-polynomial root of X²Y² equals the squared genuine Euclidean operator
    norm of XY for all positive dimensions.
- declaration: NLA.MI23.operator_norm_bounds
  scope: Generic exact entry lower bound and complete Frobenius upper bound for the genuine Euclidean
    operator norm.
- declaration: NLA.MI23.witness_data
  scope: All witness positive-definiteness, LDL and true CFC half/eighth-power identifications, with the
    actual target products.
- declaration: NLA.MI23.witness_squared_gap
  scope: Exact GH entry, complete Frobenius sum, positive rational gap and strict actual operator-norm
    separation.
- declaration: NLA.MI23.counterexample
  scope: Actual largest-root violation and failure of the complete original log-majorization relation
    for an admissible complex PD witness.
- declaration: NLA.MI23.not_generalizedGeometricMeanConjecture
  scope: Full negation of the canonical conjecture with every original dimension, matrix and real-parameter
    quantifier retained.
