version: v0.4
project:
  name: 'MI-23: generalized geometric-mean log-majorization counterexample'
  description: Formalizes the complete negative answer to the corrected canonical conjecture using complex
    positive-definite matrices, genuine CFC real powers, full characteristic-root lists and exact log-majorization.
    Proved spectral and Euclidean norm bridges connect a small exact rational certificate to the original
    target.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: MI-23 — Corrected generalized geometric-mean product conjecture
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/matrix-inequalities-and-norms/MI-23/README.md
  type: web-post
  location: Complete corrected eigenvalue log-majorization conjecture
  relationship: formalizes
  author_endorsement: not-contacted
  note: All positive dimensions, all complex positive-definite A,B and all real r,s,p,t with p≥1, 0≤t≤1
    and either r,s≥1 or r,s≤0. This is the corrected eigenvalue statement, not the earlier singular-value
    conjecture.
- title: 'MI-23: Resolution'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/matrix-inequalities-and-norms/MI-23/solution.tex
  type: manuscript
  location: Complete exact positive-definite counterexample and its norm certificate
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original counterexample and informal mathematical proof remain attributed to Colbrook. The formalization
    proves all CFC, product-spectrum and norm bridges required to turn the exact rational witness into
    a full negative answer.
