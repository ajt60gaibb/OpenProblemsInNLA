fidelity:
  divergences: No narrowing of the original target. Fin-indexed complex matrices represent every original
    dimension. Real-part mapping in the actual characteristic-root list is supported by a proved reverse
    complex-root multiset equality, positivity and dimension theorem for all positive-definite products.
    Log-majorization retains every proper nonempty prefix inequality and full product equality; only its
    first necessary inequality is needed to refute it. CFC real powers retain both parameter regions,
    negative and zero exponents and t endpoints. The r=s=1,p=2,t=1/8 rational witness negates the full
    universal assertion. Exact algebra replaces approximate fractional-power or eigenvalue calculations.
