    prompting_notes: Preserve the full complex PD target and every real parameter region. Prove complete
      ordered-root semantics, actual fractional-power identities and norm bridges. Use exact small matrix
      addition-chain certificates and one retained LeanCert kernel point inequality instead of approximate
      eigensolvers or interval searches.
  notes: AI-assisted formalization requested by George Stepaniants. Implementation agent /root/formal_review_standards
    is not counted as an independent referee. No human peer review, source-author endorsement, unrecorded
    model identity or measured monetary cost is claimed.
