  description: Formalizes the complete negative answer to the corrected canonical conjecture using
    complex positive-definite matrices, genuine CFC real powers, full characteristic-root lists
    and exact log-majorization. Proved spectral and Euclidean norm bridges connect a small exact
    rational certificate to the original target.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
