version: v0.4
project:
  name: 'MI-26: a counterexample to concave unitary-orbit subadditivity'
  description: Proves the original function-class equivalence, genuine finite-spectrum CFC and
    half-line extension bridges, exact polynomial identities for two rational projections, their
    positive quadratic-form obstruction, and the full negation of the universal complex PSD unitary-orbit
    assertion.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: MI-26 — Concave unitary-orbit subadditivity without monotonicity
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/587bd896f0e1006f4a4b7f38555e3a523ef85176/matrix-inequalities-and-norms/MI-26/README.md
  type: web-post
  location: Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: The canonical problem quantifies over every positive dimension, arbitrary complex PSD
    matrices, real-valued concave functions on the nonnegative half-line with f(0) at least zero,
    and existence of two complex unitaries. Global nonnegativity and monotonicity are absent.
- title: 'MI-26: Resolution'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/587bd896f0e1006f4a4b7f38555e3a523ef85176/matrix-inequalities-and-norms/MI-26/solution.tex
  type: manuscript
  location: Theorem 1.1 and its proof
  relationship: formalizes
  author_endorsement: not-contacted
  note: The polynomial f(x)=x-x² and two rational projections refute the complete original PSD
    assertion. The source’s additional positive-definite variant is outside the seven formal exports.
    Neither the source nor this formalization refutes the narrower globally nonnegative-valued
    function class.
