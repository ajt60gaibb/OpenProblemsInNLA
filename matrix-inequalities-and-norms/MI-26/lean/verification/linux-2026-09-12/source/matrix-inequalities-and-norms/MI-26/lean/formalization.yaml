fidelity:
  divergences: Finite matrix indices use zero-based Fin. An unrestricted real extension represents
    the original half-line function; the generic extension-independence theorem proves that negative
    arguments cannot affect PSD inputs. Genuine CFC equals the source’s full finite spectral formula
    even without global continuity. All original quantifiers and the real-valued function class
    are preserved; no nonnegative-valued, monotonicity, continuity, positive-definiteness or real-only-matrix
    premise is added. The counterexample uses a real rational pair valid over the complex field.
    The exact polynomial and quadratic-form reduction replaces spectral and unitary searches without
    weakening the full canonical negation. The optional positive-definite variant remains outside
    the formal scope.
