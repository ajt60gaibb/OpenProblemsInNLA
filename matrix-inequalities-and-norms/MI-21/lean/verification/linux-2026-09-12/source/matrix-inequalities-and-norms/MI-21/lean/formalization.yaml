project:
  name: 'MI-21: a counterexample to the weighted geometric-mean norm conjecture'
  description: Proves admissibility of the genuine Euclidean operator norm, exact CFC geometric-mean
    identities at positive definite complex matrices, a strict counterexample for every positive
    outer parameter, and the full original universal conjecture's negation.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute
      of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: MI-21 — Freewan–Hayajneh inequality for sums of weighted geometric means
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/matrix-inequalities-and-norms/MI-21/README.md
  type: web-post
  location: Problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Full all-dimension complex positive definite target attributed to Freewan and Hayajneh,
    including every unitarily invariant norm and all original real parameters.
- title: 'MI-21: Resolution'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/e7252e5307781a7c897bca6cb124f6ab838f6809/matrix-inequalities-and-norms/MI-21/solution.tex
  type: manuscript
  location: Theorem 1.1 and its complete proof
  relationship: formalizes
  author_endorsement: not-contacted
  note: The exact rational order-two witness has s=t=1/2, r=2 and both aggregate sums equal to
    the identity. The actual norm violation holds for every real p>0 and refutes the complete
    original question.
