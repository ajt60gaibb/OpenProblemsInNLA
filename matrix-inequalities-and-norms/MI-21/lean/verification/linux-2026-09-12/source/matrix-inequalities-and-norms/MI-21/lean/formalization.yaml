fidelity:
  divergences: Finite matrix and family indices use Fin and are zero-based. The target preserves
    complex positive definite inputs, real spectral powers and the original noncommuting factor
    order. The full norm class is spelled out by all complex norm axioms and independent left/right
    unitary invariance; the genuine Euclidean operator norm is separately proved admissible. A
    positive-root/Riccati uniqueness argument replaces the manuscript's calculation shortcut while
    proving the same actual CFC identities. A nonzero eigenvector proves a norm lower bound; it
    does not define or replace the norm. The witness is valid for every p>0; p=1 suffices for
    the full negation. Known narrower positive parameter regimes are not contradicted.
review:
  status: agent-reviewed; Linux-Comparator-pending
  reviewers:
  - 'OpenAI Codex agent /root: independent statement referee 1 and final proof referee 1'
  - 'OpenAI Codex agent /root/leancert_examples: independent statement referee 2 and final proof
    referee 2'
  notes: Both statement approvals precede proof implementation and bind the unchanged Definitions,
    Challenge, numerical targets and source mapping. Both final referees read the complete mathematical
    proof, independently re-elaborated Definitions, Proof and Solution into fresh local artifact
    prefixes, checked all 11 standard-three-axiom/kernel reports, and independently reconstructed
    both current common-scale Riccati certificates. Raw evidence is in reviews/proof-referee-1-root-evidence/
    and reviews/proof-referee-2-evidence/. The proof implementer is not counted as an independent
    referee. Relevant pinned Tau Ceti rubrics were adapted to this canonical target. Three deliberate
    Challenge placeholders remain isolated and are excluded from proof sorry counts. Source-level
    signatures match; actual isolated Linux Comparator, default-kernel replay and controls are
    pending. Stage-one notes and the initial proof handoff remain historical records, superseded
    on review status by the two final proof reports.
