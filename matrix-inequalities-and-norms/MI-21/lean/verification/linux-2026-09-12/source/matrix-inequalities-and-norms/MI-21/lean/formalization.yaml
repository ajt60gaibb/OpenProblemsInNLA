automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement reviews before proof; actual Mathlib
      CFC, matrix positivity and Euclidean operator APIs; two independent final proof reviews
      with fresh separate target artifacts; explicit kernel LeanCert for one rational point.
    prompting_notes: Retain every norm and parameter quantifier. Prove genuine CFC mean identities
      through positive-root uniqueness and two independently checked scaled Riccati certificates;
