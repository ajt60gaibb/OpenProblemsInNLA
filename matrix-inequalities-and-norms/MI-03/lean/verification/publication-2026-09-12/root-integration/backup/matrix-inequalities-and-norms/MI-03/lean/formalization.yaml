alignment:
- declaration: NLA.MI03.modulus_semantics
  scope: Genuine principal positive-square-root modulus, its actual square and Euclidean operator norm
    for every complex matrix in positive dimension.
- declaration: NLA.MI03.contraction_modulus
  scope: Actual I−|A| and |A|−|A|² positive semidefiniteness for every complex contraction, including
    singular and zero inputs.
- declaration: NLA.MI03.positive_decomposition
  scope: Exact all-matrix finite-sum identity and unconditional positivity of its Gram variance and Hermitian
    shifted square.
- declaration: NLA.MI03.universal_upper_bound
  scope: Full dimension-independent admissibility of k/4 for every k≥2 and every complex contraction tuple.
- declaration: NLA.MI03.root_of_unity_data
  scope: Unit norm and vanishing geometric sum of the actual complex exponential root for every k≥2.
- declaration: NLA.MI03.sharpness_witness
  scope: All-k dimension-two vector/operator norms, true CFC moduli, complete matrix sums and actual modulus
    difference.
- declaration: NLA.MI03.sharp_constant
  scope: IsLeast of the entire admissible constant set and equality of its actual real infimum to k/4
    for every k≥2.
- declaration: NLA.MI03.odd_contraction_conjecture
  scope: Unconditional full affirmative answer to the original every-odd-k≥3 conjecture.
acknowledgements: Matthew J. Colbrook for the mathematical result and proof; Bourin and Lee for the conjecture
  and previous bounds; Mathlib and LeanCert contributors for genuine CFC/order/matrix/norm/root/infimum
  and trust APIs. Shared Comparator/exporter and sandbox tooling retain their licenses and attribution.
  No external mathematical theorem is an unproved premise.
