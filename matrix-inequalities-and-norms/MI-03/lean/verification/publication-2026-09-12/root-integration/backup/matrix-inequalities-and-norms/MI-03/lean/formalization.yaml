fidelity:
  divergences: No narrowing of the original target. The stronger all-k≥2 theorem gives the complete original
    every-odd-k≥3 result. The half ordered-pair Gram sum represents the source unordered-pair variance.
    Actual CFC moduli, Euclidean operator norms, complex roots, witness matrices and admissible-set infimum
    are retained. Attainment and IsLeast precede sInf equality. Extra dimension-three Hermitian extremizers
    and rank classification are outside the eight exports.
