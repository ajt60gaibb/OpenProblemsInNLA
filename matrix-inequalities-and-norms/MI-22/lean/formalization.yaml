fidelity:
  divergences: No narrowing of the original target. The witness B differs from Colbrook’s printed integer
    B and is explicitly defined by an exact eighth-power congruence; source thresholds change to 10500
    and 11000. All principal-power, positivity, actual norm and ordered singular-value bridges are proved
    rather than assumed. Every original complex input quantifier, all real t in [0,1], every proper prefix
    and full-product equality remain in the conjecture. A first-prefix violation at n=3,t=1/8 refutes
    the entire conjunction. The original printed witness and root-error lemma are not advertised as formalized.
