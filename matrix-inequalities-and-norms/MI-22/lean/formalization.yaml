alignment:
- declaration: NLA.MI22.singular_values_semantics
  scope: Generic nonnegativity, descending order, zero extension, full adjoint-composition eigenvalue
    square-root semantics and first-value/operator-norm identity for actual Mathlib singular values.
- declaration: NLA.MI22.spectral_power_semantics
  scope: Principal spectral meaning of genuine CFC powers for every complex positive-definite matrix and
    every real exponent.
- declaration: NLA.MI22.euclidean_norm_bounds
  scope: Actual Euclidean operator-norm squared Frobenius upper bound and action-coordinate bound for
    every complex matrix and every Euclidean vector.
- declaration: NLA.MI22.witness_rational_data
  scope: All exact LDL, diagonal, positivity, unit-vector, trace, tested coordinate and full squared Frobenius
    certificates for the disclosed rational adaptation, as conclusions.
- declaration: NLA.MI22.witness_principal_powers
  scope: Every genuine principal-power identity, positivity of the actual root, the original-order noncommuting
    product reduction L Y=N and the actual root-norm bound.
- declaration: NLA.MI22.witness_operator_gap
  scope: Strict actual operator-norm bounds below 10500 for AB and above 11000 for the canonical left
    product.
- declaration: NLA.MI22.counterexample
  scope: Full original admissibility at n=3,t=1/8, strict first-singular-value reversal and failure of
    full singular-value log-majorization.
- declaration: NLA.MI22.not_weightedLogMajorizationConjecture
  scope: Unconditional negation of the full original universal complex positive-definite/all-dimensions/all-parameters
    conjecture, with every prefix and full-product equality retained.
