  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/matrix-inequalities-and-norms/MI-22/README.md
  type: web-post
  location: Complete original canonical problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: All positive dimensions, all complex positive-definite A,B and every t in [0,1], including every
    proper singular-value prefix inequality and equality at the full dimension.
- title: 'MI-22: a certified operator-norm counterexample to the weighted log-majorization'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8b3d1157b73cd526bb4d0c2fd2dd1666d41812dc/references/colbrook-matrix-2026-09-11/original-proofs/MI-22.tex
  type: manuscript
  location: Complete theorem and counterexample method; see SOURCE_CORRESPONDENCE.md for the disclosed
    changed witness
  relationship: adapts
  author_endorsement: not-contacted
  note: The original negative resolution and mathematical method remain Colbrook’s. This formalization
    preserves his diagonal A but defines a different rational B=D T^8 D using an exact dyadic adaptation
    of his root approximation R. It does not claim to formalize the printed integer B, source root-error
    theorem, residual bounds or original 10900/10200 thresholds.
