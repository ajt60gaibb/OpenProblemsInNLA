    referee 1'
  - 'OpenAI Codex agent /root: independent statement referee 2 and final proof referee 2'
  notes: Both statement reports precede implementation; all mathematical statements, targets, source correspondence
    and pins remain unchanged. Both final referees checked the complete actual proof and fresh compiled
    dependencies, with 17 internal/public standard-three reports and 195 project declarations inspected.
    Referee 1 independently parsed and reconstructed 48 actual Lean rational-table entries and printed
    the auxiliary kernel Boolean checker proof. The retained LeanCert task is only 10500<11000 on [0,0],
