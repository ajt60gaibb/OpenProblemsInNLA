automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple agents; two independent statement approvals before implementation, pinned Mathlib
      and LeanCert, then two independent final proof reviews with separate-prefix source elaboration and
      actual dependency/certificate inspection.
    prompting_notes: Keep the full complex positive-definite universal target, actual CFC powers, ordered
      singular values with multiplicities, true Euclidean norms and the complete log-majorization definition.
      Use the disclosed exact rational B=D T^8 D, exact LDL and three squarings; leave the other root
      as the actual CFC root and prove L Y=N in the original factor order. Prove every positivity and
      numerical certificate as a conclusion. Retain the explicit kernel LeanCert point inequality 10500<11000
      in the final strict reversal.
  notes: AI-assisted formalization requested by George Stepaniants. Implementation agent /root/leancert_examples
    is not an independent referee. No human review, source-author endorsement, historical priority, unrecorded
    model identity or measured cost is claimed.
