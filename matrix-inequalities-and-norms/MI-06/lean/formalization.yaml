version: v0.4
project:
  name: 'MI-06: a counterexample to arithmetic symmetric-modulus domination'
  description: >-
    Proves the genuine CFC square-root modulus identities, an exact rational
    three-dimensional witness, a nonzero common orthogonal vector for arbitrary
    complex constraints, all-unitary quadratic bounds, and the full negation of
    the original universal factor-sqrt(2) PSD domination conjecture.
  authors:
    - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology, Pasadena, California, USA
  responsible_maintainers:
    - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
  - title: MI-06 — Thompson-type domination for the arithmetic symmetric modulus
    id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/02b807770fca860ef810cc048d6849224b8f93e1/matrix-inequalities-and-norms/MI-06/README.md
    type: web-post
    location: Problem statement
    relationship: formalizes
    author_endorsement: not-contacted
    note: The original question concerns every positive dimension and every pair of arbitrary complex matrices, with existential complex unitaries and ordinary PSD order.
  - title: 'MI-06: Resolution'
    authors:
      - Matthew J. Colbrook
    id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/02b807770fca860ef810cc048d6849224b8f93e1/matrix-inequalities-and-norms/MI-06/solution.tex
    type: manuscript
    location: Corollary 1.2 and its justification following Theorem 1.1
    relationship: formalizes
    author_endorsement: not-contacted
    note: The fixed parameter t=3/4 refutes the full original sqrt(2) target. The source's stronger no-finite-constant theorem is explicitly outside the formal scope.
related_formalizations:
  - id: https://github.com/sgstepaniants/Forsythe/tree/8d1b0c0545a77b40245e84705aa7d273e6c81e62/lean-proof
    relationship: other
    note: Statement-first, explicit kernel LeanCert and Comparator workflow reference. Shared checker reuse is credited in tools/lean/NOTICE.md. No Forsythe mathematical result is assumed.
  - id: https://github.com/jaumededios/Schiffer/tree/2938e277969c329caf154e48a3d8823f3635c7f1
    relationship: other
    note: Project organization reference used by the formalization campaign; no mathematical source code is copied or imported here.
automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        Multiple agents; two independent statement approvals before proof;
        pinned Mathlib CFC, PSD, unitary and finite-rank APIs; two independent
        final proof reviews with fresh separate target artifacts; explicit
        kernel LeanCert for one exact rational point inequality.
      prompting_notes: >-
        Preserve the complete complex-matrix and all-unitary target. Prove all
        six actual CFC moduli by positive-root uniqueness and exact Gram identities.
        Use rank-one decompositions and a nonzero vector in a two-constraint kernel
        to eliminate numerical eigensolvers, unitary searches and normalization.
        Retain the kernel LeanCert certificate 2<9/4 in the final contradiction.
  notes: AI-assisted formalization requested by George Stepaniants. No external human peer review, source-author endorsement, unrecorded exact model identity or measured monetary cost is claimed.
status:
  scope: >-
    Complete negative answer to the original universal sqrt(2) assertion in
    canonical MI-06. All six exports passed local Lean compilation, standard-axiom
    checks, two independent statement reviews and two independent final proof
    reviews. Actual Linux run 34711237623 at immutable revision
    43b3dc65116633a68c32ec582fd093f3adc95597 passed formal statement comparison,
    default-kernel export replay and real sandbox/rejection controls. An independent
    operational audit verified all 117 input hashes and the original artifacts.
    Canonical status is Lean verified on 2026-09-12. The stronger no-finite-constant
    source theorem remains outside this six-export formalization.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: &standard_axioms
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
