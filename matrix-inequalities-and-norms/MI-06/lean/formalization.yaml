fidelity:
  divergences: >-
    Finite matrix indices use zero-based Fin. The complete original conjecture
    retains arbitrary complex inputs and genuine complex unitaries. Its matrix
    modulus is actual CFC.abs; PSD order is the actual Mathlib matrix order.
    The witness happens to be real rational, a valid complex input. Exact
    positive-root certificates and rank-one decompositions replace eigenvalue
    calculations. A homogeneous positive-length vector replaces the source's
    normalized vector without weakening the contradiction. The original sqrt(2)
    target is fully negated; the stronger source theorem excluding every finite
    constant is not exported.
