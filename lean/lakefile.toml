name = "LeanProofVerifier"
version = "0.1.0"
defaultTargets = ["Solution"]

# Keep this release aligned with `lean-toolchain`. See the upgrade section in
# README.md. Use an immutable LeanCert release tag, not a moving branch, for a
# real verification project.
[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert"
rev = "v4.33.1"

[[lean_lib]]
name = "ProofProject"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
